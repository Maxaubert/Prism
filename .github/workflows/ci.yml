# The gate on every pull request, and on main as a backstop: typecheck, lint,
# unit tests. Same three that release.yml runs before it ships, so a green PR
# cannot turn red on merge.
#
# The FULL e2e suite deliberately does not run here: it leans on the real
# clipboard, media fixtures and a real claude CLI on the dev machine, and stays
# the local pre-PR gate (CLAUDE.md). Its TERMINAL subset does run on a runner,
# in terminal-gate.yml (#164), because a bump of the shared terminal core has to
# be able to prove itself without anyone's PC. Media binaries are not fetched here.
# A separate job verifies the bundled search engine and private service on a
# disposable runner, including queries from an unelevated account.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
      - run: npm run test:win-e

  bundled-indexer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:everything
      - run: npm run test:everything-bundle
      - name: Verify bundled search and folder sizes without an existing Everything install
        run: npx vitest run src/main/indexerRuntime.integration.test.ts
        env:
          PRISM_INDEXER_INTEGRATION: '1'
      - name: Verify private indexing service on a clean disposable machine
        shell: pwsh
        run: ./tools/test-everything-service.ps1
