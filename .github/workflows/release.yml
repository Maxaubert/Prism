# Every push to main ships: build the NSIS installer and publish it as a
# GitHub Release named after package.json's version. A NEW version creates the
# release (with generated notes from the merged PRs). Existing versions are
# immutable; a release requires a new package version.
#
# The gates here are typecheck, lint and unit tests. The e2e suite deliberately does
# NOT run on CI: it drives real windows, real shells and a real claude CLI on
# the dev machine, none of which exist on a runner. It remains the local
# pre-PR gate (CLAUDE.md).
name: release

on:
  push:
    branches: [main]
    # Licence text cannot change the binary. A push that touches only these would
    # otherwise fail on "Require a new version", or, bumped, publish an installer
    # identical to the last one under a new name for nothing.
    paths-ignore:
      - LICENSE
      - THIRD-PARTY-NOTICES.md

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
      - run: npm run test:win-e

      - run: npm run lint

      - name: Require a new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$v already exists. Bump package.json in the PR." }
          $global:LASTEXITCODE = 0

      # Unsigned, per-user NSIS; no dependency is rebuilt (npmRebuild is false in
      # the builder config) and Prism's own sweep addon comes from build:sweep.
      # --publish never: on CI electron-builder tries to publish ITSELF and
      # fails wanting a token - the gh step below owns publishing.
      # ffmpeg for the audio Chromium will not decode (AC-3/DTS/TrueHD). The
      # binaries are not in git; this fetches the pinned LGPL build and checks
      # its SHA-256 before electron-builder copies it into resources/bin.
      - run: npm run fetch:bin
      - run: npm run test:everything-bundle
      - run: npm run build:win-e
      - run: npm run build:dwm
      # The native sweep box (#338): vendor/sweep, shipped as resources/sweep.
      - run: npm run build:sweep
      - run: npm run build
      - run: npx electron-builder --win --publish never

      # THE UPDATE IS SIGNED (#534 #10): the app runs an update only with a
      # valid <installer>.sig from the same release. The key lives only in this
      # secret; the tool refuses a key whose public half the app does not carry.
      - name: Sign the installer for the in-app update
        shell: pwsh
        env:
          PRISM_UPDATE_KEY: ${{ secrets.PRISM_UPDATE_KEY }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node tools/sign-update.mjs "dist/Prism-Setup-x64-$v.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed" }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/Prism-Setup-x64-$v.exe"
          if (-not (Test-Path $exe)) { throw "installer not found: $exe" }
          if (-not (Test-Path "$exe.sig")) { throw "signature not found: $exe.sig" }
          gh release create "v$v" $exe "$exe.sig" --title "Prism $v" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
