appId: com.prism.viewer
productName: Prism
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierrc.yaml,.prettierignore,eslint.config.js,tsconfig*.json}'
  - '!{.git,.claude,docs,test}/*'
  # Recording and render working files. Hundreds of megabytes of takes that have
  # no business inside the app, and one corrupt one that stopped the build.
  - '!.demo/**'
  - '!videos/**'
  - '!tools/**'
  - '!build/**'
  - '!dist/**'
# node-pty is the app's first native module. Its .node binaries, the conpty
# helper dir and winpty-agent.exe must live on the real file system - Windows
# cannot spawn an exe or load a DLL out of an asar archive.
asarUnpack:
  - node_modules/node-pty/**
# ...and it needs NO rebuild: 1.1.0 ships N-API prebuilds that load under this
# Electron unchanged (proved by the Task-1 smoke probe). Left on, the default
# @electron/rebuild insists on recompiling from source and dies in node-gyp.
npmRebuild: false
extraResources:
  - from: build/icon.ico
    to: icon.ico
  # ffmpeg, for the audio Chromium will not decode (AC-3/E-AC-3, DTS, TrueHD).
  # Fetched by tools/fetch-ffmpeg.mjs, never committed. BtbN's LGPL SHARED
  # build: the DLLs are replaceable, which is what LGPL asks for.
  - from: vendor/ffmpeg
    to: bin
    filter:
      - '**/*'
      - '!.source'
  # 7-Zip, for the archives Prism reads but does not write (7z, rar, tar, gz).
  # 7z.exe alone cannot read rar - the format handlers live in 7z.dll.
  - from: vendor/7zip
    to: bin
    filter:
      - '**/*'
      - '!.source'
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-Setup-${arch}-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  # Setup draws its own directory page (build/installer/pages.nsh), so MUI's is
  # off. allowElevation off keeps it per-user, which is the only mode Prism has.
  allowToChangeInstallationDirectory: false
  allowElevation: false
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: false
  createStartMenuShortcut: true
