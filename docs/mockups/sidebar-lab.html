<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism sidebar lab</title>
<style>
  /* Prism's own tokens, so what you pick here is what the app can ship. */
  :root {
    --ink: #eef0f4;
    --dim: #8a8e99;
    --dim2: #6b7080;
    --accent: #5b5bd6;
    --accent-hi: #7b7bf0;
    --viewer: #0d0f14;
    --panel: #0e1016;
    --chrome: #16181f;
    --line: rgba(255, 255, 255, 0.06);

    --row-h: 26px;
    --font-size: 12.5px;
    --indent: 13px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #08090d;
    color: var(--ink);
    font: 400 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    gap: 22px;
    max-width: 1320px;
    margin: 0 auto;
    padding: 26px 26px 0;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  /* ---------- header ---------- */

  h1 {
    margin: 0 0 2px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .sub { margin: 0 0 18px; color: var(--dim); font-size: 12.5px; }

  /* ---------- presets ---------- */

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .preset {
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
    color: var(--dim);
    border-radius: 999px;
    padding: 5px 11px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.14s, color 0.14s, background 0.14s;
  }
  .preset:hover { border-color: rgba(255, 255, 255, 0.24); color: var(--ink); }
  .preset[aria-pressed="true"] {
    border-color: var(--accent-hi);
    background: rgba(91, 91, 214, 0.22);
    color: #fff;
  }

  /* ---------- axis controls ---------- */

  .axis { margin-bottom: 11px; }
  .axis > .label {
    display: block;
    margin-bottom: 5px;
    color: var(--dim2);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .opt {
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.02);
    color: var(--dim);
    border-radius: 7px;
    padding: 4px 8px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 0.14s, color 0.14s, background 0.14s;
  }
  .opt:hover { border-color: rgba(255, 255, 255, 0.22); color: var(--ink); }
  .opt[aria-pressed="true"] {
    border-color: var(--accent-hi);
    background: rgba(91, 91, 214, 0.2);
    color: #fff;
  }
  button:focus-visible, .preset:focus-visible {
    outline: 2px solid var(--accent-hi);
    outline-offset: 2px;
  }

  /* ---------- the mock Prism window ---------- */

  .stage { min-width: 0; }

  .window {
    height: 560px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    overflow: hidden;
    background: var(--viewer);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 34px;
    padding: 0 11px;
    background: var(--chrome);
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--dim);
    flex: none;
  }
  .titlebar .brand { color: #d6a1f0; font-weight: 650; }
  .titlebar .name { color: var(--dim); }
  .titlebar .spacer { flex: 1; }
  .titlebar .dots { display: flex; gap: 7px; }
  .titlebar .dots i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); }

  .body { flex: 1; display: flex; min-height: 0; }

  .viewer {
    flex: 1;
    min-width: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(91, 91, 214, 0.16), transparent 60%),
      var(--viewer);
  }
  .plate {
    width: min(62%, 340px);
    aspect-ratio: 3 / 2;
    border-radius: 6px;
    background: linear-gradient(140deg, #7d1f2a, #b03a2e 45%, #2c3e63);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
  }

  /* ---------- the sidebar under test ---------- */

  #sidebar {
    width: 260px;
    flex: none;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }

  /* background */
  #sidebar[data-bg="seamless"] { background: var(--viewer); }
  #sidebar[data-bg="raised"] { background: #12141b; }
  #sidebar[data-bg="glass"] {
    background: rgba(22, 24, 31, 0.55);
    backdrop-filter: blur(18px) saturate(1.2);
  }

  /* divider */
  #sidebar[data-divider="none"] { border-right-color: transparent; }
  #sidebar[data-divider="shadow"] {
    border-right-color: transparent;
    box-shadow: 14px 0 26px -22px rgba(0, 0, 0, 0.9) inset;
  }

  /* density */
  #sidebar[data-density="compact"] { --row-h: 22px; --font-size: 12px; --indent: 11px; }
  #sidebar[data-density="default"] { --row-h: 26px; --font-size: 12.5px; --indent: 13px; }
  #sidebar[data-density="roomy"] { --row-h: 31px; --font-size: 13px; --indent: 15px; }

  /* header */
  .head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    color: var(--dim);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    overflow: hidden;
    white-space: nowrap;
  }
  #sidebar[data-header="none"] .head { display: none; }
  #sidebar[data-header="breadcrumb"] .head {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
  }
  .head .crumb { display: none; color: var(--dim2); }
  .head .sep { display: none; color: var(--dim2); }
  #sidebar[data-header="breadcrumb"] .crumb,
  #sidebar[data-header="breadcrumb"] .sep { display: inline; }
  #sidebar[data-header="breadcrumb"] .head .here { color: var(--ink); }

  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2px 6px 10px;
  }

  /* scrollbar */
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    border: 3px solid transparent;
    background-clip: padding-box;
  }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); background-clip: padding-box; }

  #sidebar[data-scroll="none"] .scroll { scrollbar-width: none; }
  #sidebar[data-scroll="none"] .scroll::-webkit-scrollbar { width: 0; }

  #sidebar[data-scroll="hairline"] .scroll::-webkit-scrollbar { width: 3px; }
  #sidebar[data-scroll="hairline"] .scroll::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.22);
    border: 0;
    border-radius: 2px;
  }

  #sidebar[data-scroll="pill"] .scroll::-webkit-scrollbar { width: 8px; }
  #sidebar[data-scroll="pill"] .scroll::-webkit-scrollbar-thumb {
    background: transparent;
    border: 2px solid transparent;
    transition: background 0.18s;
  }
  #sidebar[data-scroll="pill"] .scroll:hover::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.26);
    background-clip: padding-box;
  }

  #sidebar[data-scroll="accent"] .scroll::-webkit-scrollbar { width: 4px; }
  #sidebar[data-scroll="accent"] .scroll::-webkit-scrollbar-thumb {
    background: var(--accent);
    border: 0;
    border-radius: 2px;
    opacity: 0.75;
  }

  /* rows */
  ul { margin: 0; padding: 0; list-style: none; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    height: var(--row-h);
    padding: 0 8px 0 var(--pad, 6px);
    border: 0;
    background: none;
    color: #b9bdc8;
    font: inherit;
    font-size: var(--font-size);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
  }
  .row .txt { overflow: hidden; text-overflow: ellipsis; }
  .row.folder { color: #c8ccd6; }

  #sidebar[data-rows="plain"] .row:hover { color: #fff; }
  #sidebar[data-rows="bleed"] .row:hover { background: rgba(255, 255, 255, 0.055); color: #fff; }
  #sidebar[data-rows="inset"] .row { border-radius: 7px; }
  #sidebar[data-rows="inset"] .row:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  #sidebar[data-rows="bar"] .row:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
  #sidebar[data-rows="bar"] .row:hover::before {
    content: "";
    position: absolute;
    left: 0;
    top: 3px;
    bottom: 3px;
    width: 2px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.22);
  }

  /* selection */
  .row.on { color: #fff; font-weight: 550; }
  #sidebar[data-select="fill"] .row.on { background: rgba(91, 91, 214, 0.26); border-radius: 7px; }
  #sidebar[data-select="solid"] .row.on { background: var(--accent); border-radius: 7px; }
  #sidebar[data-select="tintbar"] .row.on { background: rgba(91, 91, 214, 0.14); border-radius: 7px; }
  #sidebar[data-select="tintbar"] .row.on::after {
    content: "";
    position: absolute;
    left: 0;
    top: 2px;
    bottom: 2px;
    width: 2px;
    border-radius: 2px;
    background: var(--accent-hi);
  }
  #sidebar[data-select="text"] .row.on { background: none; color: var(--accent-hi); }
  #sidebar[data-select="text"] .row.on .ico { color: var(--accent-hi); }

  /* icons */
  .ico { flex: none; display: grid; place-items: center; width: 14px; height: 14px; color: var(--dim); }
  .row.on .ico { color: #fff; }
  .chev {
    flex: none;
    width: 12px;
    height: 12px;
    color: var(--dim2);
    transition: transform 0.14s;
  }
  .folder.open .chev { transform: rotate(90deg); }
  .chev.hidden { visibility: hidden; }

  #sidebar[data-icons="none"] .ico { display: none; }
  #sidebar[data-icons="dot"] .ico { width: 6px; }
  #sidebar[data-icons="tint"] .file .ico[data-kind="image"] { color: #6fb2a8; }
  #sidebar[data-icons="tint"] .file .ico[data-kind="video"] { color: #8f8ae0; }
  #sidebar[data-icons="tint"] .file .ico[data-kind="audio"] { color: #d3a06a; }
  #sidebar[data-icons="tint"] .file .ico[data-kind="pdf"] { color: #cf7f88; }
  #sidebar[data-icons="tint"] .file .ico[data-kind="text"] { color: #8d93a1; }
  #sidebar[data-icons="tint"] .folder .ico { color: #9aa0f0; }

  /* indent guides */
  .kids { position: relative; }
  #sidebar[data-guides="line"] .kids::before,
  #sidebar[data-guides="hover"] .kids::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(var(--guide, 0px) + 12px);
    width: 1px;
    background: rgba(255, 255, 255, 0.07);
  }
  #sidebar[data-guides="hover"] .kids::before { opacity: 0; transition: opacity 0.16s; }
  #sidebar[data-guides="hover"] .scroll:hover .kids::before { opacity: 1; }

  .note {
    padding: 4px 0 4px 26px;
    color: var(--dim2);
    font-size: 11px;
    font-style: italic;
  }

  /* ---------- readout ---------- */

  .readout { margin-top: 14px; padding-bottom: 26px; }
  .recipe {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    padding: 11px 13px;
  }
  .recipe code {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    color: #cfd3dd;
    font: 500 12px/1.6 "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }
  .recipe button {
    flex: none;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .recipe button:hover { border-color: var(--accent-hi); }
  .hint { margin: 8px 2px 0; color: var(--dim2); font-size: 11.5px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div>
    <h1>Sidebar lab</h1>
    <p class="sub">Ten starting points, then mix any axis. The line at the bottom is the recipe.</p>

    <div class="presets" id="presets"></div>
    <div id="axes"></div>
  </div>

  <div class="stage">
    <div class="window">
      <div class="titlebar">
        <span class="brand">Prism</span>
        <span class="name">IMG_0421.jpg</span>
        <span class="spacer"></span>
        <span class="name">7 / 24</span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
      <div class="body">
        <aside id="sidebar">
          <div class="head">
            <span class="crumb">Pictures</span><span class="sep">&nbsp;›&nbsp;</span><span class="here">Trip 2026</span>
          </div>
          <div class="scroll"><div id="tree"></div></div>
        </aside>
        <div class="viewer"><div class="plate"></div></div>
      </div>
    </div>

    <div class="readout">
      <div class="recipe">
        <code id="recipe"></code>
        <button id="copy" type="button">Copy recipe</button>
      </div>
      <p class="hint">Paste the recipe back to me and I'll build exactly that.</p>
    </div>
  </div>
</div>

<script>
/* ---------- the tree we're previewing ---------- */

const TREE = [
  { type: 'folder', name: 'Day 1 — Lisbon', open: true, kids: [
    { type: 'file', name: 'IMG_0418.jpg', kind: 'image' },
    { type: 'file', name: 'IMG_0421.jpg', kind: 'image', on: true },
    { type: 'file', name: 'IMG_0422.jpg', kind: 'image' },
    { type: 'folder', name: 'Edited', open: true, kids: [
      { type: 'file', name: 'alfama-golden-hour.jpg', kind: 'image' },
      { type: 'file', name: 'tram-28.jpg', kind: 'image' }
    ]},
    { type: 'file', name: 'tram-ride.mp4', kind: 'video' },
    { type: 'file', name: 'street-notes.md', kind: 'text' }
  ]},
  { type: 'folder', name: 'Day 2 — Sintra', open: false, kids: [] },
  { type: 'folder', name: 'Raw', open: false, kids: [] },
  { type: 'folder', name: 'Scans', open: true, kids: [
    { type: 'file', name: 'tickets.pdf', kind: 'pdf' },
    { type: 'file', name: 'museum-guide.pdf', kind: 'pdf' }
  ]},
  { type: 'file', name: 'cover.jpg', kind: 'image' },
  { type: 'file', name: 'packing-list.md', kind: 'text' },
  { type: 'file', name: 'itinerary.pdf', kind: 'pdf' },
  { type: 'file', name: 'lisbon-fado.mp3', kind: 'audio' },
  { type: 'file', name: 'walkthrough.mp4', kind: 'video' },
  { type: 'file', name: 'day-one-recap.mp4', kind: 'video' },
  { type: 'file', name: 'ferry-times.md', kind: 'text' },
  { type: 'file', name: 'IMG_0507.jpg', kind: 'image' },
  { type: 'file', name: 'IMG_0508.jpg', kind: 'image' }
];

/* ---------- icon sets ---------- */

const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

// Filled shapes with their detail knocked out in the panel colour, so a 14px
// glyph still reads as a photo / clip / page rather than a grey blob.
const KO = ' fill="#0e1016" fill-opacity=".85"';
const FILLED = {
  folder: '<path d="M2.5 5.5h6.2l2 2.6h10.8v10.4H2.5z"/>',
  image:
    '<path d="M3.5 5h17v14h-17z"/>' +
    '<path d="M6 16.2l3.6-4.2 2.6 3 2.3-2.4 3.5 3.6z"' + KO + '/>' +
    '<circle cx="8.4" cy="9.2" r="1.7"' + KO + '/>',
  video: '<path d="M3.5 5h17v14h-17z"/><path d="M10 9.2l5.6 2.8L10 14.8z"' + KO + '/>',
  audio: '<path d="M9 16.4V6l10-2v10.4a2.6 2.6 0 1 1-1.6-2.4V6.6L10.6 8.2v8.2A2.6 2.6 0 1 1 9 14z"/>',
  pdf:
    '<path d="M6 2.5h7.5L19 8v13.5H6z"/><path d="M13 2.5V8h5.4z" fill-opacity=".55"/>' +
    '<path d="M8.6 15.5h6.8v3.2H8.6z"' + KO + '/>',
  text:
    '<path d="M6 2.5h7.5L19 8v13.5H6z"/><path d="M13 2.5V8h5.4z" fill-opacity=".55"/>' +
    '<path d="M8.6 12h7.8v1.3H8.6zM8.6 15.2h7.8v1.3H8.6zM8.6 18.4h5v1.3h-5z"' + KO + '/>',
};

const OUTLINE = {
  folder: '<path d="M3 6h6l2 2.5h10V19H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  image: '<path d="M4 5h16v14H4zM4 15l4.5-4.5L13 15l3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  video: '<path d="M4 6h16v12H4zM10 9.5l5 2.5-5 2.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  audio: '<path d="M9 17V6l10-2v11M9 17a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm10-2a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  pdf: '<path d="M6 3h8l4 4v14H6zM14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  text: '<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 16.5h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
};

function iconSvg(mode, kind) {
  if (mode === 'none') return '';
  if (mode === 'dot') {
    return kind === 'folder'
      ? '<svg viewBox="0 0 24 24" width="6" height="6"><rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" width="6" height="6"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>';
  }
  const set = mode === 'outline' ? OUTLINE : FILLED;
  const path = set[kind] || set.text;
  return '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">' + path + '</svg>';
}

/* ---------- render ---------- */

function rowHtml(node, depth, icons) {
  const pad = 'style="--pad:' + (6 + depth * 13) + 'px"';
  if (node.type === 'folder') {
    const kids = node.open && node.kids.length
      ? '<div class="kids" style="--guide:' + (6 + depth * 13) + 'px">' + node.kids.map((k) => rowHtml(k, depth + 1, icons)).join('') + '</div>'
      : node.open
        ? '<div class="note">empty</div>'
        : '';
    return (
      '<div><button class="row folder' + (node.open ? ' open' : '') + '" ' + pad + '>' +
        CHEV +
        '<span class="ico" data-kind="folder">' + iconSvg(icons, 'folder') + '</span>' +
        '<span class="txt">' + node.name + '</span>' +
      '</button>' + kids + '</div>'
    );
  }
  return (
    '<button class="row file' + (node.on ? ' on' : '') + '" ' + pad + '>' +
      CHEV.replace('class="chev"', 'class="chev hidden"') +
      '<span class="ico" data-kind="' + node.kind + '">' + iconSvg(icons, node.kind) + '</span>' +
      '<span class="txt">' + node.name + '</span>' +
    '</button>'
  );
}

/* ---------- axes ---------- */

const AXES = [
  { key: 'icons', label: 'Icons', opts: [
    ['filled', 'Filled'], ['tint', 'Filled + kind tint'], ['outline', 'Outline'], ['dot', 'Dots'], ['none', 'None']
  ]},
  { key: 'rows', label: 'Row hover', opts: [
    ['plain', 'Text only'], ['bleed', 'Full bleed'], ['inset', 'Inset rounded'], ['bar', 'Left bar']
  ]},
  { key: 'select', label: 'Selected file', opts: [
    ['fill', 'Accent fill'], ['tintbar', 'Tint + bar'], ['solid', 'Solid indigo'], ['text', 'Accent text']
  ]},
  { key: 'scroll', label: 'Scrollbar', opts: [
    ['none', 'None'], ['hairline', 'Hairline'], ['pill', 'Pill on hover'], ['accent', 'Accent hairline'], ['default', 'Standard']
  ]},
  { key: 'bg', label: 'Panel background', opts: [
    ['panel', 'Panel'], ['seamless', 'Seamless'], ['raised', 'Raised'], ['glass', 'Glass']
  ]},
  { key: 'density', label: 'Density', opts: [
    ['compact', 'Compact'], ['default', 'Default'], ['roomy', 'Roomy']
  ]},
  { key: 'guides', label: 'Indent guides', opts: [
    ['none', 'None'], ['line', 'Hairline'], ['hover', 'On hover']
  ]},
  { key: 'header', label: 'Header', opts: [
    ['caps', 'Folder name'], ['breadcrumb', 'Breadcrumb'], ['none', 'None']
  ]},
  { key: 'divider', label: 'Edge', opts: [
    ['line', 'Hairline'], ['none', 'None'], ['shadow', 'Inner shadow']
  ]}
];

const PRESETS = {
  'Current': { icons: 'outline', rows: 'inset', select: 'fill', scroll: 'default', bg: 'panel', density: 'default', guides: 'none', header: 'caps', divider: 'line' },
  'Quiet': { icons: 'filled', rows: 'plain', select: 'text', scroll: 'none', bg: 'seamless', density: 'compact', guides: 'none', header: 'none', divider: 'none' },
  'IDE': { icons: 'tint', rows: 'bleed', select: 'fill', scroll: 'hairline', bg: 'panel', density: 'compact', guides: 'line', header: 'caps', divider: 'line' },
  'Ghost': { icons: 'dot', rows: 'plain', select: 'tintbar', scroll: 'none', bg: 'seamless', density: 'default', guides: 'none', header: 'none', divider: 'shadow' },
  'Rail': { icons: 'filled', rows: 'bar', select: 'tintbar', scroll: 'hairline', bg: 'panel', density: 'compact', guides: 'none', header: 'caps', divider: 'line' },
  'Glass': { icons: 'tint', rows: 'inset', select: 'fill', scroll: 'pill', bg: 'glass', density: 'default', guides: 'none', header: 'breadcrumb', divider: 'none' },
  'Contrast': { icons: 'filled', rows: 'bleed', select: 'solid', scroll: 'accent', bg: 'raised', density: 'default', guides: 'line', header: 'caps', divider: 'line' },
  'Paper': { icons: 'none', rows: 'plain', select: 'tintbar', scroll: 'none', bg: 'seamless', density: 'roomy', guides: 'none', header: 'breadcrumb', divider: 'none' },
  'Studio': { icons: 'tint', rows: 'inset', select: 'tintbar', scroll: 'pill', bg: 'raised', density: 'roomy', guides: 'hover', header: 'caps', divider: 'none' },
  'Wire': { icons: 'outline', rows: 'bar', select: 'text', scroll: 'hairline', bg: 'seamless', density: 'compact', guides: 'line', header: 'none', divider: 'line' }
};

let state = { ...PRESETS['Quiet'] };

const sidebar = document.getElementById('sidebar');
const tree = document.getElementById('tree');
const recipe = document.getElementById('recipe');

function render() {
  for (const a of AXES) sidebar.dataset[a.key] = state[a.key];
  tree.innerHTML = TREE.map((n) => rowHtml(n, 0, state.icons)).join('');

  document.querySelectorAll('.opt').forEach((b) => {
    b.setAttribute('aria-pressed', String(state[b.dataset.axis] === b.dataset.value));
  });
  const match = Object.entries(PRESETS).find(([, p]) => AXES.every((a) => p[a.key] === state[a.key]));
  document.querySelectorAll('.preset').forEach((b) => {
    b.setAttribute('aria-pressed', String(!!match && match[0] === b.dataset.preset));
  });

  recipe.textContent = AXES.map((a) => a.key + '=' + state[a.key]).join('  ');
}

/* controls */
document.getElementById('presets').innerHTML = Object.keys(PRESETS)
  .map((n) => '<button class="preset" type="button" data-preset="' + n + '">' + n + '</button>')
  .join('');

document.getElementById('axes').innerHTML = AXES.map((a) =>
  '<div class="axis"><span class="label">' + a.label + '</span><div class="opts">' +
  a.opts.map(([v, l]) => '<button class="opt" type="button" data-axis="' + a.key + '" data-value="' + v + '">' + l + '</button>').join('') +
  '</div></div>'
).join('');

document.addEventListener('click', (e) => {
  const opt = e.target.closest('.opt');
  if (opt) { state[opt.dataset.axis] = opt.dataset.value; render(); return; }
  const pre = e.target.closest('.preset');
  if (pre) { state = { ...PRESETS[pre.dataset.preset] }; render(); }
});

document.getElementById('copy').addEventListener('click', async (e) => {
  await navigator.clipboard.writeText(recipe.textContent);
  e.target.textContent = 'Copied';
  setTimeout(() => { e.target.textContent = 'Copy recipe'; }, 1400);
});

render();
</script>
</body>
</html>
