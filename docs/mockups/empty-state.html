<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism — the empty window, thirty ways</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body { margin: 0; padding: 22px 22px 60px; background: #08090d; color: #eef0f4;
    font: 400 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
  h1 { margin: 0 0 2px; font-size: 17px; font-weight: 650; letter-spacing: -.01em }
  .sub { margin: 0 0 14px; color: #8a8e99; font-size: 12.5px; max-width: 100ch }
  .bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: center }
  .btn { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); color: #b9bdc8;
    border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer }
  .btn:hover { border-color: rgba(255,255,255,.28); color: #fff }
  .btn[aria-pressed="true"] { background: #2f6fed; border-color: #4d9dff; color: #fff; font-weight: 600 }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7080; margin: 0 4px 0 10px }

  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px }
  .case { border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; background: #0c0e12 }
  .case header { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.06) }
  .case h2 { margin: 0; font-size: 12px; font-weight: 650 }
  .case .n { color: #4c5260; font-size: 11px; font-variant-numeric: tabular-nums }
  .case .note { flex: 1; color: #6b7080; font-size: 10.5px; text-align: right }

  /* ---------------- the window ---------------- */
  .win {
    --bg: #0b0d12; --text: #f2f4f8; --dim: #99a0ac; --dim2: #6f7681;
    --line: rgba(255,255,255,.10); --hover: rgba(255,255,255,.05);
    --accent: #2f6fed; --accent-2: #4d9dff; --on-accent: #fff;
    height: 300px; position: relative; overflow: hidden; background: var(--bg); color: var(--text);
    display: grid; place-items: center; padding: 24px;
  }
  .win[data-mode="light"] {
    --bg: #fbfcfe; --text: #0f1319; --dim: #575c65; --dim2: #7b8089;
    --line: rgba(0,0,0,.12); --hover: rgba(0,0,0,.05); --accent: #2f6fed; --accent-2: #4d9dff; --on-accent: #fff;
  }
  .win::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(58% 56% at 20% 22%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 72%),
                radial-gradient(54% 52% at 80% 78%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 72%) }
  .win[data-mode="light"]::before { opacity: .8 }
  .win * { box-sizing: border-box }
  .es { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; max-width: 300px }
  .es h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; color: var(--text) }
  .es p { margin: 0; font-size: 12.5px; color: var(--dim) }
  .cta { border: 0; border-radius: 10px; padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 650;
    background: var(--accent); color: var(--on-accent); cursor: pointer }
  .cta.ghost { background: none; border: 1px solid var(--line); color: var(--text) }
  .cta.link { background: none; padding: 0; color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px }
  .cta.pill { border-radius: 99px; padding: 9px 22px }
  .cta.square { border-radius: 4px }
  .cta.wide { width: 100%; }
  .kbd { display: inline-flex; gap: 5px; align-items: center; font-size: 11px; color: var(--dim2) }
  .kbd b { border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; font-weight: 700; color: var(--dim);
    background: var(--hover) }

  /* ---------------- icon treatments ---------------- */
  .ico { display: grid; place-items: center; color: var(--accent-2) }
  .ico svg { display: block }
  .tile { width: 76px; height: 76px; border-radius: 20px; background: color-mix(in srgb, var(--accent) 20%, transparent) }
  .tile.grad { background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: #fff }
  .tile.outline { background: none; border: 1.5px solid var(--line) }
  .tile.dashed { background: none; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent) }
  .tile.round { border-radius: 50% }
  .tile.sq { border-radius: 6px }
  .tile.glass { background: color-mix(in srgb, var(--text) 8%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(8px) }
  .tile.big { width: 104px; height: 104px; border-radius: 28px }
  .bare { width: auto; height: auto; background: none; border: 0 }
  .ghosted { color: color-mix(in srgb, var(--text) 22%, transparent) }
  .watermark { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    color: color-mix(in srgb, var(--text) 7%, transparent) }
  .stackicons { display: flex }
  .stackicons > * { margin-left: -14px; border: 2px solid var(--bg); border-radius: 12px }
  .stackicons > *:first-child { margin-left: 0 }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center }
  .chip { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--dim2);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px }

  /* ---------------- layouts ---------------- */
  .drop { border: 2px dashed color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 20px;
    padding: 26px 30px; background: color-mix(in srgb, var(--accent) 6%, transparent) }
  .row { flex-direction: row; text-align: left; gap: 18px; align-items: center; max-width: 400px }
  .row .col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start }
  .quiet h3 { font-size: 15px; font-weight: 600; color: var(--dim) }
  .huge h3 { font-size: 30px; letter-spacing: -.035em; line-height: 1.02 }
  .card { border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px;
    background: color-mix(in srgb, var(--text) 4%, transparent) }
  .corners { position: absolute; inset: 26px; pointer-events: none }
  .corners i { position: absolute; width: 24px; height: 24px; border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent) }
  .corners i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0 }
  .corners i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0 }
  .corners i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px }
  .corners i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0 }
</style>
</head>
<body>

<h1>The empty window, thirty ways</h1>
<p class="sub">What Prism shows before you open anything: the mark, the words and the button. Each is a whole variation - a different idea of what the icon should be, how it should be treated, and what the copy asks you to do. Switch the mode to see both.</p>

<div class="bar">
  <span class="lbl" style="margin-left:0">Mode</span>
  <button class="btn" data-mode="dark" aria-pressed="true">Dark</button>
  <button class="btn" data-mode="light">Light</button>
  <span class="lbl">Wash</span>
  <button class="btn" data-wash="on" aria-pressed="true">On</button>
  <button class="btn" data-wash="off">Off</button>
</div>

<div class="wall" id="wall"></div>

<script>
/* ---------------- icons: one idea each ---------------- */
const S = (d, extra = '', size = 30, w = 1.7) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor"
     stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${extra}<path d="${d}"/></svg>`

const I = {
  diamond: (s) => S('M12 3l9 9-9 9-9-9z', '', s),
  prism: (s) => S('M12 3L3 19h18z', '<path d="M12 3v16M12 11l7 8M12 11L5 19"/>', s),
  folderOpen: (s) => S('M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1', '<path d="M3 9h17l-2.2 9.2a1 1 0 0 1-1 .8H5.2a1 1 0 0 1-1-.8z"/>', s),
  image: (s) => S('M3 5h18v14H3z', '<path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9" r="1.4"/>', s),
  play: (s) => S('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '<path d="M10.5 8.8l6 3.2-6 3.2z"/>', s),
  dropIn: (s) => S('M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5', '<path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>', s),
  tray: (s) => S('M4 14h4l1.5 3h5L16 14h4', '<path d="M4 14l2.5-8h11L20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>', s),
  plus: (s) => S('M12 5v14M5 12h14', '', s, 2),
  film: (s) => S('M3 5h18v14H3z', '<path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>', s),
  wave: (s) => S('M3 12h2l2-6 3 13 3-9 2 4h6', '', s),
  doc: (s) => S('M6 3h8l4 4v14H6z', '<path d="M14 3v4h4"/>', s),
  layers: (s) => S('M12 3l9 5-9 5-9-5z', '<path d="M3 13l9 5 9-5M3 17l9 5 9-5"/>', s),
  eye: (s) => S('M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z', '<circle cx="12" cy="12" r="2.6"/>', s),
  sparkle: (s) => S('M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z', '', s),
  aperture: (s) => S('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '<path d="M12 3l4.5 7.8M21 12h-9M16.5 19.8L12 12M7.5 19.8L12 12M3 12l4.5-7.8"/>', s),
  bars: (s) => S('M5 15v4M9.5 10v9M14 6v13M18.5 12v7', '', s, 2.4),
  disc: (s) => S('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '<circle cx="12" cy="12" r="2.4"/>', s),
  frameCorners: (s) => S('M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4', '', s, 2),
  cursorFile: (s) => S('M6 3h7l4 4v9H6z', '<path d="M13 3v4h4"/><path d="M12.5 13.5L20 21l-1.8.6-1-1.7-1.6 1.1z"/>', s),
  grid: (s) => S('M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', '', s),
  cloud: (s) => S('M7 18a4 4 0 0 1 .6-8 5.2 5.2 0 0 1 10 1.2A3.4 3.4 0 0 1 17.5 18z', '<path d="M12 11v6m0 0l-2.2-2.2M12 17l2.2-2.2"/>', s),
  bracket: (s) => S('M9 4H5v16h4M15 4h4v16h-4', '', s, 2),
  target: (s) => S('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '<circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/>', s),
  pageFold: (s) => S('M6 3h9l3 3v15H6z', '<path d="M15 3v3h3"/><path d="M9 13h6M9 17h4"/>', s),
  cards: (s) => S('M7 6h13v12H7z', '<path d="M4 8v10a2 2 0 0 0 2 2h11"/>', s),
  dots: (s) => S('M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01', '', s, 2.6),
  mountain: (s) => S('M3 5h18v14H3z', '<path d="M3 17l5.5-6 4 4.5 3-3L21 17"/><circle cx="8" cy="9" r="1.3"/>', s),
  timeline: (s) => S('M3 12h18', '<circle cx="8" cy="12" r="2.2"/><path d="M3 7v10M21 7v10"/>', s),
  hex: (s) => S('M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z', '', s),
  monogram: (s) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none">
      <path d="M12 3L3.5 19h17z" fill="currentColor" opacity=".22"/>
      <path d="M12 3L3.5 19h17z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 3v16" stroke="currentColor" stroke-width="1.7"/></svg>`,
  shutter: (s) => S('M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', '<path d="M12 12l7.8-4.5M12 12v9M12 12L4.2 7.5"/>', s),
  arrowInBox: (s) => S('M4 4h16v16H4z', '<path d="M12 8v7m0 0l-3-3m3 3l3-3"/>', s)
}

/* ---------------- the thirty ---------------- */
const V = [
  { n: 'Diamond, as shipped', note: 'today', icon: 'diamond', tile: 'tile',
    h: 'Open a file to view it', p: 'Drop a file here, or', cta: 'Browse…' },

  { n: 'Prism mark, filled', note: 'the app itself', icon: 'prism', tile: 'tile grad',
    h: 'Nothing open yet', p: 'Drop anything Prism can read.', cta: 'Choose a file' },

  { n: 'Drop arrow', note: 'says what to do', icon: 'dropIn', tile: 'tile dashed',
    h: 'Drop a file here', p: 'Images, video, audio, documents.', cta: 'Or browse…', ctaClass: 'ghost' },

  { n: 'Dashed drop zone', note: 'the whole area is the target', icon: 'tray', tile: 'bare', layout: 'drop',
    h: 'Drop it anywhere', p: 'The whole window is the target.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Folder, open', note: 'familiar', icon: 'folderOpen', tile: 'tile sq',
    h: 'No file open', p: 'Open one to start looking.', cta: 'Open…' },

  { n: 'Image, outline', note: 'what it mostly opens', icon: 'image', tile: 'tile outline',
    h: 'Open a file to view it', p: 'Or drop one on the window.', cta: 'Browse…' },

  { n: 'Play, round', note: 'media first', icon: 'play', tile: 'tile round grad',
    h: 'Ready when you are', p: 'Drop a file, or pick one.', cta: 'Pick a file', ctaClass: 'pill' },

  { n: 'Layers', note: 'a stack of formats', icon: 'layers', tile: 'tile',
    h: 'One viewer, every file', p: 'Photos, video, audio, PDFs.', cta: 'Browse…' },

  { n: 'Bare glyph, no tile', note: 'quietest', icon: 'diamond', tile: 'bare', iconSize: 46,
    h: 'Nothing open', p: 'Drop a file here, or', cta: 'Browse…', ctaClass: 'link' },

  { n: 'Ghosted mark', note: 'barely there', icon: 'prism', tile: 'bare ghosted', iconSize: 60,
    h: 'Prism', p: 'Drop a file to open it.', cta: 'Browse…', ctaClass: 'ghost', layout: 'quiet' },

  { n: 'Watermark behind', note: 'mark as background', icon: 'prism', tile: 'bare', watermark: true, iconSize: 0,
    h: 'Open a file to view it', p: 'Drop it here, or', cta: 'Browse…' },

  { n: 'Big type, no icon', note: 'words do the work', icon: null, layout: 'huge',
    h: 'Drop a file.', p: 'Prism opens most things.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Glass tile', note: 'matches the material', icon: 'aperture', tile: 'tile glass',
    h: 'Open a file to view it', p: 'Drop a file here, or', cta: 'Browse…' },

  { n: 'Corner frame', note: 'the window is the frame', icon: 'frameCorners', tile: 'bare', corners: true, iconSize: 0,
    h: 'Drop a file in the frame', p: 'Anything Prism can read.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Card', note: 'contained', icon: 'doc', tile: 'tile sq', layout: 'card',
    h: 'No file open', p: 'Drop one here, or choose it.', cta: 'Choose file' },

  { n: 'Side by side', note: 'icon left, words right', icon: 'folderOpen', tile: 'tile sq', layout: 'row',
    h: 'Open a file', p: 'Or drop it on the window.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Format chips', note: 'says what it takes', icon: 'grid', tile: 'tile',
    h: 'Open a file to view it', p: 'Drop a file here, or', cta: 'Browse…',
    chips: ['JPG', 'PNG', 'MP4', 'MP3', 'PDF'] },

  { n: 'Keyboard first', note: 'for the shortcut crowd', icon: 'bracket', tile: 'tile outline',
    h: 'Nothing open', p: 'Drop a file, browse, or', cta: 'Browse…', ctaClass: 'ghost',
    kbd: ['Ctrl', 'O'] },

  { n: 'Stacked marks', note: 'three kinds at once', icon: 'image', tile: 'tile sq', stack: ['image', 'film', 'wave'],
    h: 'One window for all of it', p: 'Drop a file to begin.', cta: 'Browse…' },

  { n: 'Waveform', note: 'audio-leaning', icon: 'wave', tile: 'tile',
    h: 'Play something', p: 'Or view a photo, or a PDF.', cta: 'Open a file', ctaClass: 'pill' },

  { n: 'Film strip', note: 'video-leaning', icon: 'film', tile: 'tile sq',
    h: 'Open a file to view it', p: 'Drop a file here, or', cta: 'Browse…', ctaClass: 'square' },

  { n: 'Eye', note: 'a viewer, not an editor', icon: 'eye', tile: 'tile round',
    h: 'Nothing to look at yet', p: 'Drop a file on the window.', cta: 'Browse…' },

  { n: 'Target', note: 'aim here', icon: 'target', tile: 'tile dashed',
    h: 'Drop a file here', p: 'Or pick one from disk.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Cloud down', note: 'from anywhere', icon: 'cloud', tile: 'tile',
    h: 'Drag one in', p: 'From the desktop, Explorer, anywhere.', cta: 'Browse…' },

  { n: 'Sparkle', note: 'friendlier', icon: 'sparkle', tile: 'tile grad round',
    h: 'A quiet place to look', p: 'Drop a file, and Prism gets out of the way.', cta: 'Browse…', ctaClass: 'pill' },

  { n: 'Page with a fold', note: 'documents', icon: 'pageFold', tile: 'tile outline sq',
    h: 'Open a document', p: 'PDFs, text, source, markdown.', cta: 'Browse…' },

  { n: 'Hexagon', note: 'geometric', icon: 'hex', tile: 'bare', iconSize: 54,
    h: 'Open a file to view it', p: 'Drop a file here, or', cta: 'Browse…', ctaClass: 'square' },

  { n: 'Cursor on a file', note: 'literal', icon: 'cursorFile', tile: 'tile sq',
    h: 'Double-click a file', p: 'Or drop it here. Prism opens it instantly.', cta: 'Browse…', ctaClass: 'ghost' },

  { n: 'Monogram', note: 'brand mark', icon: 'monogram', tile: 'tile big', iconSize: 44,
    h: 'Prism', p: 'Drop a file to open it.', cta: 'Browse…', layout: 'quiet' },

  { n: 'Shutter', note: 'photographic', icon: 'shutter', tile: 'tile round outline',
    h: 'Open a photo', p: 'Or anything else Prism reads.', cta: 'Browse…' },

  { n: 'Arrow in a box', note: 'the window takes it', icon: 'arrowInBox', tile: 'bare', iconSize: 52,
    h: 'Drop it in', p: 'The window is the drop zone.', cta: 'Browse…', ctaClass: 'link' },

  { n: 'Wide button', note: 'the action is the point', icon: 'plus', tile: 'tile round',
    h: 'Nothing open', p: 'Drop a file here, or', cta: 'Browse…', ctaClass: 'wide' },

  { n: 'Two lines only', note: 'as little as possible', icon: null, layout: 'quiet',
    h: 'Drop a file here', p: '', cta: 'Browse…', ctaClass: 'link' },

  { n: 'Disc', note: 'a record on the shelf', icon: 'disc', tile: 'tile round',
    h: 'Put something on', p: 'Audio, video, or a photo.', cta: 'Browse…', ctaClass: 'pill' }
]

/* ---------------- render ---------------- */
let mode = 'dark'
let wash = true

const iconHtml = (v) => {
  if (v.stack) {
    return `<div class="ico stackicons">${v.stack
      .map((k) => `<span class="ico ${v.tile}" style="width:56px;height:56px;border-radius:14px">${I[k](24)}</span>`)
      .join('')}</div>`
  }
  if (!v.icon) return ''
  const size = v.iconSize ?? 30
  if (size === 0) return ''
  return `<div class="ico ${v.tile || 'tile'}">${I[v.icon](size)}</div>`
}

function card(v, i) {
  const body = `
    <div class="es ${v.layout || ''}">
      ${v.layout === 'row' ? iconHtml(v) : iconHtml(v)}
      <div class="${v.layout === 'row' ? 'col' : ''}" style="${v.layout === 'row' ? '' : 'display:contents'}">
        <h3>${v.h}</h3>
        ${v.p ? `<p>${v.p}</p>` : ''}
        ${v.chips ? `<div class="chiprow">${v.chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>` : ''}
        <button class="cta ${v.ctaClass || ''}">${v.cta}</button>
        ${v.kbd ? `<span class="kbd">or press ${v.kbd.map((k) => `<b>${k}</b>`).join('')}</span>` : ''}
      </div>
    </div>`
  return `
    <section class="case">
      <header><span class="n">${String(i + 1).padStart(2, '0')}</span><h2>${v.n}</h2><span class="note">${v.note}</span></header>
      <div class="win" data-mode="${mode}" ${wash ? '' : 'data-wash="off"'}>
        ${v.watermark ? `<div class="watermark">${I[v.icon](200)}</div>` : ''}
        ${v.corners ? '<div class="corners"><i></i><i></i><i></i><i></i></div>' : ''}
        ${body}
      </div>
    </section>`
}

function render() {
  document.getElementById('wall').innerHTML = V.map(card).join('')
  document.querySelectorAll('.win').forEach((w) => {
    w.dataset.mode = mode
    if (!wash) w.style.setProperty('--wash-off', '1')
  })
  if (!wash) {
    document.querySelectorAll('.win').forEach((w) => (w.style.background = 'var(--bg)'))
    const style = document.getElementById('washoff') || document.createElement('style')
    style.id = 'washoff'
    style.textContent = '.win::before { display: none }'
    document.head.appendChild(style)
  } else {
    document.getElementById('washoff')?.remove()
  }
  document.querySelectorAll('.btn[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)))
  document.querySelectorAll('.btn[data-wash]').forEach((b) =>
    b.setAttribute('aria-pressed', String((b.dataset.wash === 'on') === wash)))
}

document.addEventListener('click', (e) => {
  const m = e.target.closest('.btn[data-mode]')
  if (m) { mode = m.dataset.mode; render(); return }
  const w = e.target.closest('.btn[data-wash]')
  if (w) { wash = w.dataset.wash === 'on'; render() }
})

render()
</script>
</body>
</html>
