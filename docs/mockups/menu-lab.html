<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism menu lab</title>
<style>
  :root {
    --ink: #eef0f4;
    --dim: #8a8e99;
    --dim2: #6b7080;
    --accent: #5b5bd6;
    --accent-hi: #7b7bf0;
    --panel: #0e1016;
    --viewer: #0d0f14;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 26px 26px 40px;
    background: #08090d;
    color: var(--ink);
    font: 400 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 0 0 2px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { margin: 0 0 20px; color: var(--dim); font-size: 12.5px; }

  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .toggle {
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: var(--dim);
    border-radius: 999px;
    padding: 5px 11px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"] { border-color: var(--accent-hi); background: rgba(91,91,214,.22); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }

  /* Each card is a slice of the real sidebar, with the menu open on a row. */
  .card {
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
    cursor: pointer;
    transition: border-color .15s;
  }
  .card:hover { border-color: rgba(255,255,255,.2); }
  .card[aria-pressed="true"] { border-color: var(--accent-hi); }
  .stage { position: relative; height: 168px; padding: 8px 6px; }
  .row {
    display: flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 8px; border-radius: 6px;
    font-size: 12.5px; color: #b9bdc8;
  }
  .row i { width: 14px; height: 14px; border-radius: 2px; background: #6fb2a8; flex: none; }
  .row.folder i { background: #9aa0f0; border-radius: 2px 2px 3px 3px; }
  .row.on { background: rgba(255,255,255,.05); color: #fff; }
  .meta {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    border-top: 1px solid rgba(255,255,255,.06);
    padding: 9px 12px 10px;
  }
  .meta b { font-size: 12.5px; font-weight: 600; }
  .meta span { color: var(--dim2); font-size: 11px; }

  /* ---- the menus ---- */
  .menu {
    position: absolute; left: 74px; top: 46px;
    min-width: 148px; z-index: 2;
    font-size: 12px;
  }
  .menu button {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    width: 100%; border: 0; background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .menu .hint { color: var(--dim2); font-size: 10.5px; }
  .menu .ico { width: 13px; height: 13px; flex: none; opacity: .8; }
  .menu .lbl { display: flex; align-items: center; gap: 8px; }
  /* Two classes deep so it outranks the per-variant `.m-x button` colour. */
  .menu button.danger { color: #d97b84; }

  /* 1. Flat: no border, one shade lighter than the panel */
  .m-flat { background: #191c23; border-radius: 4px; padding: 4px 0; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .m-flat button { height: 26px; padding: 0 10px; color: #c8ccd6; }
  .m-flat button:hover { background: rgba(255,255,255,.06); color: #fff; }

  /* 2. Hairline: square, thin rule between items */
  .m-hairline { background: #101319; border: 1px solid rgba(255,255,255,.12); border-radius: 2px; }
  .m-hairline button { height: 28px; padding: 0 11px; color: #c8ccd6; }
  .m-hairline button + button { border-top: 1px solid rgba(255,255,255,.07); }
  .m-hairline button:hover { background: rgba(255,255,255,.05); color: #fff; }

  /* 3. Accent bar: a marker slides in on hover */
  .m-bar { background: #14171e; border: 1px solid rgba(255,255,255,.08); border-radius: 4px; padding: 3px 0; }
  .m-bar button { position: relative; height: 26px; padding: 0 10px 0 12px; color: #c8ccd6; }
  .m-bar button::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px;
    background: var(--accent-hi); opacity: 0; transition: opacity .12s;
  }
  .m-bar button:hover { background: rgba(255,255,255,.05); color: #fff; }
  .m-bar button:hover::before { opacity: 1; }
  .m-bar button.danger:hover::before { background: #d97b84; }

  /* 4. Solid: full accent fill on hover, Explorer-ish */
  .m-solid { background: #1a1d25; border: 1px solid rgba(255,255,255,.1); border-radius: 3px; padding: 3px 0; }
  .m-solid button { height: 25px; padding: 0 10px; color: #d0d4dd; }
  .m-solid button:hover { background: var(--accent); color: #fff; }
  .m-solid button:hover .hint { color: rgba(255,255,255,.7); }
  .m-solid button.danger:hover { background: #b4353f; color: #fff; }

  /* 5. Glass: translucent, blurred, no hard edges */
  .m-glass {
    background: rgba(30,33,42,.72); backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 4px;
    box-shadow: 0 14px 36px rgba(0,0,0,.5);
  }
  .m-glass button { height: 26px; padding: 0 9px; border-radius: 5px; color: #d7dae1; }
  .m-glass button:hover { background: rgba(255,255,255,.1); color: #fff; }

  /* 6. Tight: the smallest it can be and stay clickable */
  .m-tight { background: #15181f; border: 1px solid rgba(255,255,255,.1); border-radius: 3px; padding: 2px 0; min-width: 128px; }
  .m-tight button { height: 22px; padding: 0 8px; font-size: 11.5px; color: #c8ccd6; }
  .m-tight button:hover { background: rgba(255,255,255,.07); color: #fff; }

  /* 7. Roomy: generous, macOS-ish */
  .m-roomy { background: #1c1f28; border: 1px solid rgba(255,255,255,.08); border-radius: 7px; padding: 5px; min-width: 168px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .m-roomy button { height: 30px; padding: 0 10px; border-radius: 4px; font-size: 12.5px; color: #d7dae1; }
  .m-roomy button:hover { background: rgba(255,255,255,.08); color: #fff; }

  /* 8. Inverted: light menu on the dark app */
  .m-light { background: #eceef3; border: 1px solid rgba(0,0,0,.12); border-radius: 4px; padding: 3px 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .m-light button { height: 26px; padding: 0 10px; color: #23262e; }
  .m-light button:hover { background: rgba(0,0,0,.07); }
  .m-light .hint { color: #7b8090; }
  .menu.m-light button.danger { color: #b4353f; }

  /* 9. Rule: header-less, one divider before the destructive action */
  .m-rule { background: #13161c; border: 1px solid rgba(255,255,255,.09); border-radius: 4px; padding: 3px 0; }
  .m-rule button { height: 26px; padding: 0 10px; color: #c8ccd6; }
  .m-rule button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .m-rule .sep { height: 1px; margin: 3px 0; background: rgba(255,255,255,.08); }

  .recipe {
    display: flex; align-items: center; gap: 12px;
    margin-top: 22px; padding: 11px 13px;
    border: 1px solid rgba(255,255,255,.09); border-radius: 10px; background: rgba(255,255,255,.02);
  }
  .recipe code { flex: 1; color: #cfd3dd; font: 500 12px/1.6 "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .recipe button {
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<h1>Right-click menu</h1>
<p class="sub">Nine takes on the same two actions, on the real sidebar background. Click one to pick it.</p>

<div class="toggles">
  <button class="toggle" data-opt="icons" aria-pressed="false">Icons</button>
  <button class="toggle" data-opt="hints" aria-pressed="true">Shortcut hints</button>
</div>

<div class="grid" id="grid"></div>

<div class="recipe">
  <code id="recipe">pick a menu</code>
  <button id="copy" type="button">Copy pick</button>
</div>

<script>
const VARIANTS = [
  { id: 'flat', name: 'Flat', note: 'No border, lifted by shade alone' },
  { id: 'hairline', name: 'Hairline', note: 'Square, ruled between items' },
  { id: 'bar', name: 'Accent bar', note: 'Marker slides in on hover' },
  { id: 'solid', name: 'Solid hover', note: 'Full accent fill, Explorer-ish' },
  { id: 'glass', name: 'Glass', note: 'Translucent, blurred, soft' },
  { id: 'tight', name: 'Tight', note: 'Smallest that stays clickable' },
  { id: 'roomy', name: 'Roomy', note: 'Generous, macOS-ish' },
  { id: 'light', name: 'Inverted', note: 'Light menu on the dark app' },
  { id: 'rule', name: 'Ruled', note: 'Divider before the destructive one' }
]

const ICONS = {
  rename: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  delete: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>'
}

const state = { icons: false, hints: true, pick: null }

function menuHtml(id) {
  const ico = (k) => (state.icons ? ICONS[k] : '')
  const hint = (h) => (state.hints ? `<span class="hint">${h}</span>` : '')
  const sep = id === 'rule' ? '<div class="sep"></div>' : ''
  return `
    <div class="menu m-${id}">
      <button><span class="lbl">${ico('rename')}Rename</span>${hint('F2')}</button>
      ${sep}
      <button class="danger"><span class="lbl">${ico('delete')}Delete</span>${hint('Del')}</button>
    </div>`
}

function cardHtml(v) {
  return `
    <div class="card" data-id="${v.id}" role="button" aria-pressed="${state.pick === v.id}">
      <div class="stage">
        <div class="row folder"><i></i>Day 1 — Lisbon</div>
        <div class="row on"><i></i>IMG_0421.jpg</div>
        <div class="row"><i></i>IMG_0422.jpg</div>
        ${menuHtml(v.id)}
      </div>
      <div class="meta"><b>${v.name}</b><span>${v.note}</span></div>
    </div>`
}

function render() {
  document.getElementById('grid').innerHTML = VARIANTS.map(cardHtml).join('')
  document.querySelectorAll('.toggle').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.opt])))
  const v = VARIANTS.find((x) => x.id === state.pick)
  document.getElementById('recipe').textContent = v
    ? `menu=${v.id}  icons=${state.icons ? 'yes' : 'no'}  hints=${state.hints ? 'yes' : 'no'}`
    : 'pick a menu'
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('.card')
  if (card) { state.pick = card.dataset.id; render(); return }
  const t = e.target.closest('.toggle')
  if (t) { state[t.dataset.opt] = !state[t.dataset.opt]; render() }
})

document.getElementById('copy').addEventListener('click', async (e) => {
  await navigator.clipboard.writeText(document.getElementById('recipe').textContent)
  e.target.textContent = 'Copied'
  setTimeout(() => { e.target.textContent = 'Copy pick' }, 1400)
})

render()
</script>
</body>
</html>
