<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism onboarding — ten treatments</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body { margin: 0; padding: 22px 22px 60px; background: #08090d; color: #eef0f4;
    font: 400 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased }
  h1 { margin: 0 0 2px; font-size: 17px; font-weight: 650; letter-spacing: -.01em }
  .sub { margin: 0 0 14px; color: #8a8e99; font-size: 12.5px; max-width: 100ch }
  .bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center }
  .btn { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); color: #b9bdc8;
    border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer }
  .btn:hover { border-color: rgba(255,255,255,.28); color: #fff }
  .btn[aria-pressed="true"] { background: #5b5bd6; border-color: #7b7bf0; color: #fff; font-weight: 600 }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7080; margin: 0 4px 0 10px }
  .frame { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; background: #06070a; padding: 16px; display: grid; place-items: center }
  .caption { margin: 10px 2px 0; font-size: 12px; color: #6b7080 }
  .caption b { color: #cfd3db; font-weight: 650 }

  h2.sheeth { margin: 34px 0 4px; font-size: 14px; font-weight: 650 }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px }
  .cell { border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; background: #0c0e12; cursor: pointer }
  .cell:hover { border-color: rgba(255,255,255,.3) }
  .cell header { display: flex; align-items: baseline; gap: 8px; padding: 8px 11px; border-bottom: 1px solid rgba(255,255,255,.06) }
  .cell h3 { margin: 0; font-size: 12px; font-weight: 650 }
  .cell span { font-size: 10.5px; color: #6b7080 }
  .cell .mini { height: 190px; overflow: hidden; position: relative; background: #06070a }
  .cell .mini .win { position: absolute; top: 0; left: 0; width: 1000px; transform: scale(.3); transform-origin: 0 0 }

  /* ==========================================================
     THE WINDOW  (shared shell; every variant restyles it)
     ========================================================== */
  .win {
    --bg: #0b0d12; --side: #12151b; --title: #14171e; --text: #f2f4f8; --dim: #99a0ac; --dim2: #6f7681;
    --line: rgba(255,255,255,.10); --accent: #38bdf8; --accent-2: #6366f1; --on-accent: #04121a;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --hsize: 58px; --hweight: 800; --htrack: -.045em; --radius: 12px;
    position: relative; width: 100%; max-width: 1000px; aspect-ratio: 16 / 10;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--font); isolation: isolate;
  }
  .win * { box-sizing: border-box }
  .titlebar { position: absolute; inset: 0 0 auto; height: 34px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--title); border-bottom: 1px solid var(--line); z-index: 40 }
  .titlebar .mark { width: 13px; height: 13px; border-radius: 3px; background: linear-gradient(140deg, var(--accent), var(--accent-2)) }
  .titlebar .name { font-size: 12px; font-weight: 700; letter-spacing: -.01em; color: var(--accent) }
  .titlebar .wc { margin-left: auto; color: var(--dim2); font-size: 11px; letter-spacing: .45em }
  .screen { position: absolute; inset: 34px 0 0; overflow: hidden }
  .ghost { position: absolute; inset: 0; z-index: 30; overflow: hidden; pointer-events: none }

  /* copy furniture */
  .pad { position: absolute; inset: 0; padding: 52px 62px; display: flex; flex-direction: column; z-index: 20 }
  .kicker { font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--accent) }
  .h { margin: 14px 0 0; font-size: var(--hsize); line-height: .98; font-weight: var(--hweight);
    letter-spacing: var(--htrack); max-width: 15ch }
  .h em { font-style: normal; color: var(--dim2) }
  .p { margin: 15px 0 0; font-size: 15.5px; line-height: 1.5; color: var(--dim); max-width: 40ch }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 13px }
  .rail { display: flex; gap: 7px; margin-right: 3px }
  .rail i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); display: block; transition: .3s cubic-bezier(.16,1,.3,1) }
  .rail i.on { width: 26px; background: var(--accent) }
  .cta { border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-size: 14px; font-weight: 700;
    background: var(--accent); color: var(--on-accent); cursor: pointer; transition: transform .16s cubic-bezier(.23,1,.32,1) }
  .cta:hover { transform: translateY(-1px) } .cta:active { transform: scale(.97) }
  .back { border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font: inherit; font-size: 13.5px;
    font-weight: 600; background: none; color: var(--dim); cursor: pointer }
  .skip { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--dim2); cursor: pointer }

  /* arrival: parts deal in once, on the click that brought you here */
  .in > * { opacity: 0; transform: translateY(16px); animation: dealin .6s cubic-bezier(.16,1,.3,1) forwards }
  .in > *:nth-child(1) { animation-delay: .03s } .in > *:nth-child(2) { animation-delay: .09s }
  .in > *:nth-child(3) { animation-delay: .15s } .in > *:nth-child(4) { animation-delay: .21s }
  .in > *:nth-child(5) { animation-delay: .27s }
  @keyframes dealin { to { opacity: 1; transform: none } }

  /* welcome, shared skeleton */
  .welcome { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 25; padding: 40px }
  .welcome .inner { display: flex; flex-direction: column; align-items: center; max-width: 44ch }
  .logo { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(140deg, var(--accent), var(--accent-2));
    animation: logoin .8s cubic-bezier(.16,1,.3,1) both; position: relative; overflow: hidden }
  @keyframes logoin { from { opacity: 0; transform: scale(.72) translateY(16px) } to { opacity: 1; transform: none } }
  .welcome h2 { margin: 26px 0 0; font-size: 60px; font-weight: var(--hweight); letter-spacing: var(--htrack); line-height: 1;
    opacity: 0; animation: dealin .7s cubic-bezier(.16,1,.3,1) .16s forwards }
  .welcome p { margin: 16px 0 0; font-size: 16.5px; color: var(--dim); opacity: 0;
    animation: dealin .7s cubic-bezier(.16,1,.3,1) .26s forwards }
  .welcome .cta { margin-top: 30px; opacity: 0; animation: dealin .7s cubic-bezier(.16,1,.3,1) .36s forwards; padding: 13px 28px; font-size: 15px }

  /* mode cards */
  .modes { display: flex; gap: 14px; margin-top: 24px }
  .mcard { width: 166px; border: 1px solid var(--line); border-radius: 14px; padding: 10px;
    background: color-mix(in srgb, var(--text) 4%, transparent); cursor: pointer;
    transition: transform .2s cubic-bezier(.23,1,.32,1), box-shadow .2s, border-color .2s }
  .mcard:hover { transform: translateY(-2px) }
  .mcard.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
  .mcard .prev { height: 72px; border-radius: 9px; overflow: hidden; display: flex }
  .mcard .prev i { width: 32%; display: block } .mcard .prev u { flex: 1; display: block; position: relative }
  .mcard .prev u::after { content: ""; position: absolute; left: 14%; right: 14%; top: 30%; height: 34%; border-radius: 4px;
    background: linear-gradient(140deg,#7d1f2a,#b03a2e 45%,#2c3e63) }
  .mcard.dark .prev i { background: #12151b } .mcard.dark .prev u { background: #0b0d12 }
  .mcard.light .prev i { background: #eceef2 } .mcard.light .prev u { background: #f7f8fa }
  .mcard b { display: block; margin-top: 9px; font-size: 13.5px; font-weight: 700 }
  .mcard span { display: block; font-size: 11.5px; color: var(--dim2) }

  /* tree */
  .tree { position: absolute; left: 0; top: 0; bottom: 0; width: 300px; background: var(--side);
    border-right: 1px solid var(--line); padding: 26px 0; z-index: 10;
    transform: translateX(-100%); animation: treein .9s cubic-bezier(.16,1,.3,1) .1s forwards }
  @keyframes treein { to { transform: none } }
  .tree .row { display: flex; align-items: center; gap: 11px; padding: 0 24px; height: 34px;
    opacity: 0; transform: translateX(-16px); animation: dealx .55s cubic-bezier(.16,1,.3,1) forwards }
  .tree .row:nth-child(1) { animation-delay: .26s } .tree .row:nth-child(2) { animation-delay: .32s }
  .tree .row:nth-child(3) { animation-delay: .38s } .tree .row:nth-child(4) { animation-delay: .44s }
  .tree .row:nth-child(5) { animation-delay: .50s } .tree .row:nth-child(6) { animation-delay: .56s }
  .tree .row:nth-child(7) { animation-delay: .62s } .tree .row:nth-child(8) { animation-delay: .68s }
  @keyframes dealx { to { opacity: 1; transform: none } }
  .tree .row i { width: 13px; height: 13px; border-radius: 3px; background: var(--dim2); opacity: .5; flex: none; display: block }
  .tree .row u { height: 7px; border-radius: 4px; background: var(--dim2); opacity: .4; display: block }
  .tree .row.on { background: var(--accent); border-radius: 0 10px 10px 0; margin-right: 18px }
  .tree .row.on i, .tree .row.on u { background: var(--on-accent); opacity: .95 }
  .keys { position: absolute; right: 92px; top: 50%; display: flex; gap: 10px; z-index: 12 }
  .keycap { padding: 12px 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg);
    font-size: 15px; font-weight: 800; color: var(--text); box-shadow: 0 4px 0 var(--line);
    opacity: 0; transform: translateY(10px); animation: dealin .5s cubic-bezier(.16,1,.3,1) .5s forwards }
  .keycap:nth-child(2) { animation-delay: .58s }
  .shift { padding-left: 372px }

  /* swatches */
  .accentrow { display: flex; gap: 12px; margin-top: 24px }
  .accentrow i { width: 44px; height: 44px; border-radius: 14px; display: block; cursor: pointer;
    transition: transform .18s cubic-bezier(.23,1,.32,1), box-shadow .18s }
  .accentrow i:hover { transform: translateY(-3px) }
  .accentrow i.on { box-shadow: 0 0 0 2.5px var(--text) }

  /* file tiles */
  .fan { position: absolute; right: 76px; top: 50%; transform: translateY(-50%); z-index: 5; width: 380px; height: 300px }
  .tile { position: absolute; width: 128px; height: 158px; border-radius: 16px; border: 1px solid var(--line);
    background: color-mix(in srgb, var(--text) 5%, var(--bg)); opacity: 0;
    animation: fanin .8s cubic-bezier(.16,1,.3,1) forwards }
  .tile:nth-child(1) { left: 0; top: 84px; --rot: -13deg; animation-delay: .16s }
  .tile:nth-child(2) { left: 120px; top: 34px; --rot: -2deg; animation-delay: .26s }
  .tile:nth-child(3) { left: 240px; top: 84px; --rot: 11deg; animation-delay: .36s }
  @keyframes fanin { from { opacity: 0; transform: translateY(40px) scale(.92) } to { opacity: 1; transform: rotate(var(--rot)) } }
  .tile u { position: absolute; left: 18px; right: 18px; height: 6px; border-radius: 4px; background: var(--dim2); opacity: .3; display: block }
  .tile u:nth-of-type(1) { top: 26px } .tile u:nth-of-type(2) { top: 40px; right: 46px }
  .tile b { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--dim2) }
  .tile .badge { position: absolute; right: -14px; bottom: -14px; width: 46px; height: 46px; border-radius: 15px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); display: grid; place-items: center;
    opacity: 0; transform: scale(.4); animation: pop .6s cubic-bezier(.16,1,.3,1) forwards }
  .tile:nth-child(1) .badge { animation-delay: .8s } .tile:nth-child(2) .badge { animation-delay: .9s } .tile:nth-child(3) .badge { animation-delay: 1s }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) } 60% { opacity: 1; transform: scale(1.14) } 100% { opacity: 1; transform: none } }
  .tile .badge svg { width: 24px; height: 24px; color: #fff }

  /* ==========================================================
     VARIANT 1 — AURORA : soft light, deep space, gradient washes
     ========================================================== */
  .v-aurora { --accent: #7dd3fc; --accent-2: #a78bfa; --on-accent: #06121b; --radius: 16px }
  .v-aurora .wash { position: absolute; inset: -25%; z-index: 0; filter: blur(10px); opacity: .85;
    background: radial-gradient(46% 46% at 24% 26%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%),
                radial-gradient(42% 42% at 76% 74%, color-mix(in srgb, var(--accent-2) 34%, transparent), transparent 70%);
    animation: aurorain 1.1s cubic-bezier(.16,1,.3,1) both }
  @keyframes aurorain { from { opacity: 0; transform: scale(1.12) } to { opacity: .85; transform: none } }
  .v-aurora .cta { box-shadow: 0 14px 34px -14px var(--accent) }

  /* ==========================================================
     VARIANT 2 — SLATE : swiss, hairlines, numerals, no glow
     ========================================================== */
  .v-slate { --accent: #e8e8ea; --accent-2: #9a9aa2; --on-accent: #0a0a0b; --bg: #0a0a0b; --side: #101012;
    --text: #f4f4f5; --dim: #a1a1aa; --dim2: #71717a; --line: rgba(255,255,255,.14); --hweight: 700; --htrack: -.03em }
  .v-slate[data-mode="light"] { --bg: #fafafa; --side: #f0f0f1; --text: #09090b; --dim: #52525b; --dim2: #a1a1aa;
    --line: rgba(0,0,0,.16); --accent: #18181b; --on-accent: #fafafa }
  .v-slate .kicker { color: var(--dim2); letter-spacing: .3em; font-weight: 700 }
  .v-slate .num { font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--dim2) }
  .v-slate .rule { height: 1px; background: var(--line); margin: 22px 0 0; transform-origin: left;
    animation: drawrule .8s cubic-bezier(.16,1,.3,1) .1s both }
  @keyframes drawrule { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .v-slate .cta, .v-slate .back { border-radius: 2px }
  .v-slate .tile, .v-slate .mcard, .v-slate .keycap { border-radius: 2px }
  .v-slate .accentrow i { border-radius: 2px }
  .v-slate .grid { position: absolute; inset: 0; z-index: 0; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 78px 78px; mask-image: radial-gradient(70% 70% at 70% 40%, #000, transparent) }

  /* ==========================================================
     VARIANT 3 — SPOTLIGHT : one lamp, everything else falls away
     ========================================================== */
  .v-spot { --bg: #030405; --side: #08090c; --accent: #f5f5f7; --accent-2: #b9bec7; --on-accent: #06070a;
    --text: #fafafa; --dim: #8b8f98; --dim2: #5b6069 }
  .v-spot[data-mode="light"] { --bg: #ffffff; --side: #f3f4f6; --text: #0a0a0a; --dim: #4b5058; --accent: #111214; --on-accent: #fff }
  .v-spot .lamp { position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(38% 60% at 32% 46%, color-mix(in srgb, var(--text) 12%, transparent), transparent 72%);
    animation: lampin 1.2s cubic-bezier(.16,1,.3,1) both }
  @keyframes lampin { from { opacity: 0; transform: scale(.8) } to { opacity: 1; transform: none } }
  .v-spot .pad { padding: 60px 70px }
  .v-spot .h { font-size: 62px }
  .v-spot .cta { border-radius: 99px } .v-spot .back { border-radius: 99px }
  .v-spot .tile { background: #0f1013 } .v-spot .keycap { border-radius: 99px }

  /* ==========================================================
     VARIANT 4 — DECK : the step is a card, and cards get dealt
     ========================================================== */
  .v-deck { --bg: #101319; --side: #161a22; --accent: #34d399; --accent-2: #22d3ee; --on-accent: #052018 }
  .v-deck[data-mode="light"] { --bg: #eef1f6; --side: #e2e7ef; --text: #0d1117; --dim: #4a515c; --accent: #0f9d76; --on-accent: #fff }
  .v-deck .card { position: absolute; inset: 44px 56px; border-radius: 22px; background: var(--side);
    border: 1px solid var(--line); box-shadow: 0 40px 70px -40px rgba(0,0,0,.9); z-index: 5;
    animation: dealcard .7s cubic-bezier(.16,1,.3,1) both }
  @keyframes dealcard { from { opacity: 0; transform: translateY(46px) rotate(-1.4deg) scale(.97) } to { opacity: 1; transform: none } }
  .v-deck .card::before, .v-deck .card::after { content: ""; position: absolute; inset: 0; border-radius: 22px;
    border: 1px solid var(--line); background: var(--side); z-index: -1 }
  .v-deck .card::before { transform: translateY(12px) scale(.985); opacity: .6 }
  .v-deck .card::after { transform: translateY(24px) scale(.97); opacity: .3 }
  .v-deck .pad { padding: 46px 52px }
  .v-deck .tree { left: 44px; top: 44px; bottom: 44px; border-radius: 22px 0 0 22px; width: 250px; z-index: 6 }
  .v-deck .fan { right: 96px }

  /* ==========================================================
     VARIANT 5 — FILMSTRIP : the media runs through the frame
     ========================================================== */
  .v-film { --bg: #0a0a0c; --side: #111114; --accent: #fbbf24; --accent-2: #f97316; --on-accent: #1a1200 }
  .v-film[data-mode="light"] { --bg: #fbfaf7; --side: #f2efe9; --text: #14120e; --dim: #55504a; --accent: #b45309; --on-accent: #fff }
  .v-film .strip { position: absolute; left: 0; right: 0; top: 44px; height: 190px; display: flex; gap: 14px;
    align-items: center; padding-left: 62px; z-index: 4 }
  .v-film .strip .fr { width: 150px; height: 100px; border-radius: 10px; flex: none; opacity: 0;
    background: linear-gradient(140deg,#3b3350,#5a3550 60%,#2c3e63); animation: filmin .7s cubic-bezier(.16,1,.3,1) forwards }
  .v-film .strip .fr:nth-child(1) { animation-delay: .06s } .v-film .strip .fr:nth-child(2) { animation-delay: .13s }
  .v-film .strip .fr:nth-child(3) { animation-delay: .20s; width: 220px; height: 140px; background: linear-gradient(140deg,#7d1f2a,#b03a2e 45%,#2c3e63) }
  .v-film .strip .fr:nth-child(4) { animation-delay: .27s } .v-film .strip .fr:nth-child(5) { animation-delay: .34s }
  @keyframes filmin { from { opacity: 0; transform: translateX(46px) } to { opacity: 1; transform: none } }
  .v-film .pad { padding-top: 250px }
  .v-film .h { font-size: 50px }
  .v-film .tree { top: 240px }

  /* ==========================================================
     VARIANT 6 — SPLIT : two planes, and they trade places
     ========================================================== */
  .v-split { --bg: #0d0f14; --side: #14171e; --accent: #f43f5e; --accent-2: #fb7185; --on-accent: #fff }
  .v-split[data-mode="light"] { --bg: #fff; --side: #f4f4f5; --text: #101014; --dim: #52525b; --accent: #e11d48; --on-accent: #fff }
  .v-split .plane { position: absolute; left: 0; top: 0; bottom: 0; width: 42%; z-index: 2;
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
    animation: planein .8s cubic-bezier(.16,1,.3,1) both }
  @keyframes planein { from { transform: translateX(-100%) } to { transform: none } }
  .v-split .plane .art { position: absolute; inset: 0; display: grid; place-items: center }
  .v-split .pad { padding-left: 48%; padding-top: 62px }
  .v-split .h { font-size: 52px }
  .v-split .tree { width: 42%; background: linear-gradient(160deg, var(--accent), var(--accent-2)); border: 0 }
  .v-split .tree .row i, .v-split .tree .row u { background: #fff; opacity: .55 }
  .v-split .tree .row.on { background: rgba(255,255,255,.92) }
  .v-split .tree .row.on i, .v-split .tree .row.on u { background: var(--accent); opacity: 1 }
  .v-split .fan { display: none }
  .v-split .planetiles { position: absolute; inset: 0; display: grid; place-items: center; gap: 12px; grid-auto-flow: column }
  .v-split .planetiles i { width: 62px; height: 78px; border-radius: 10px; background: rgba(255,255,255,.9); display: block;
    opacity: 0; animation: dealin .6s cubic-bezier(.16,1,.3,1) forwards }
  .v-split .planetiles i:nth-child(2) { animation-delay: .08s } .v-split .planetiles i:nth-child(3) { animation-delay: .16s }

  /* ==========================================================
     VARIANT 7 — TERMINAL : mono, typed, green
     ========================================================== */
  .v-term { --bg: #05080a; --side: #080d10; --text: #d7e0d9; --dim: #7d9285; --dim2: #4d6355;
    --accent: #22c55e; --accent-2: #16a34a; --on-accent: #04140a; --line: rgba(34,197,94,.22);
    --font: "Cascadia Mono", Consolas, ui-monospace, monospace; --hweight: 700; --htrack: -.02em; --hsize: 44px }
  .v-term[data-mode="light"] { --bg: #f2f5f2; --side: #e7ede8; --text: #0b1a10; --dim: #40584a; --accent: #15803d; --on-accent: #fff }
  .v-term .kicker { letter-spacing: .18em }
  .v-term .kicker::before { content: "$ " }
  .v-term .h { overflow: hidden; white-space: nowrap; border-right: 3px solid var(--accent); width: fit-content;
    animation: type 1.1s steps(28, end) both }
  @keyframes type { from { max-width: 0 } to { max-width: 100% } }
  .v-term .cta, .v-term .back, .v-term .mcard, .v-term .tile, .v-term .keycap { border-radius: 3px }
  .v-term .cta::before { content: "> " }
  .v-term .scan { position: absolute; inset: 0; z-index: 0; opacity: .35;
    background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(34,197,94,.05) 3px 4px) }

  /* ==========================================================
     VARIANT 8 — GLASS : frosted panels over a blurred wall
     ========================================================== */
  .v-glass { --accent: #a5b4fc; --accent-2: #f0abfc; --on-accent: #10102a; --line: rgba(255,255,255,.22) }
  .v-glass .wall { position: absolute; inset: -10%; z-index: 0; filter: blur(46px) saturate(1.3);
    background: conic-gradient(from 210deg at 40% 40%, #4338ca, #7e22ce, #db2777, #0891b2, #4338ca);
    opacity: .55; animation: aurorain 1.1s cubic-bezier(.16,1,.3,1) both }
  .v-glass[data-mode="light"] .wall { opacity: .38 }
  .v-glass .panel { position: absolute; inset: 46px 58px; border-radius: 24px; z-index: 5;
    background: color-mix(in srgb, var(--bg) 55%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(26px) saturate(1.2); box-shadow: 0 40px 80px -40px rgba(0,0,0,.8);
    animation: glassin .8s cubic-bezier(.16,1,.3,1) both }
  @keyframes glassin { from { opacity: 0; transform: translateY(24px) scale(.985) } to { opacity: 1; transform: none } }
  .v-glass .pad { padding: 48px 54px }
  .v-glass .tree { left: 46px; top: 46px; bottom: 46px; width: 260px; border-radius: 24px 0 0 24px; z-index: 6;
    background: color-mix(in srgb, var(--bg) 40%, transparent); backdrop-filter: blur(30px); border-right: 1px solid var(--line) }
  .v-glass .mcard, .v-glass .tile { background: color-mix(in srgb, var(--bg) 45%, transparent); backdrop-filter: blur(14px) }
  .v-glass .fan { right: 100px }

  /* ==========================================================
     VARIANT 9 — BLUEPRINT : it draws itself, in outline
     ========================================================== */
  .v-blue { --bg: #071018; --side: #0a1520; --text: #dbeafe; --dim: #7ea6c4; --dim2: #4d7897;
    --accent: #38bdf8; --accent-2: #0ea5e9; --on-accent: #04121a; --line: rgba(56,189,248,.28) }
  .v-blue[data-mode="light"] { --bg: #f3f8fd; --side: #e8f1fa; --text: #082032; --dim: #3a6b8c; --accent: #0369a1; --on-accent: #fff }
  .v-blue .paper { position: absolute; inset: 0; z-index: 0; opacity: .6;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px }
  .v-blue .drawing { position: absolute; right: 60px; top: 50%; transform: translateY(-50%); width: 400px; height: 300px; z-index: 4 }
  .v-blue .drawing svg { width: 100%; height: 100%; overflow: visible }
  .v-blue .drawing path, .v-blue .drawing rect, .v-blue .drawing circle, .v-blue .drawing line {
    fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 1.6s cubic-bezier(.16,1,.3,1) forwards }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .v-blue .drawing .fillish { fill: color-mix(in srgb, var(--accent) 16%, transparent) }
  .v-blue .tile, .v-blue .mcard, .v-blue .keycap { background: transparent; border-color: var(--accent) }
  .v-blue .cta { border-radius: 4px } .v-blue .back { border-radius: 4px }

  /* ==========================================================
     VARIANT 10 — POSTER : one enormous word, the UI is a footnote
     ========================================================== */
  .v-poster { --bg: #0c0a09; --side: #171412; --text: #fafaf9; --dim: #a8a29e; --dim2: #78716c;
    --accent: #f5f5f4; --accent-2: #d6d3d1; --on-accent: #0c0a09; --hweight: 900 }
  .v-poster[data-mode="light"] { --bg: #f5f5f4; --side: #e7e5e4; --text: #0c0a09; --dim: #57534e; --accent: #0c0a09; --on-accent: #fafaf9 }
  .v-poster .word { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; overflow: hidden }
  .v-poster .word b { font-size: 200px; font-weight: 900; letter-spacing: -.07em; line-height: .8;
    color: color-mix(in srgb, var(--text) 12%, transparent); white-space: nowrap; display: flex }
  .v-poster .word b span { display: inline-block; opacity: 0; transform: translateY(60px);
    animation: dealin .8s cubic-bezier(.16,1,.3,1) forwards }
  .v-poster .pad { padding: 56px 64px; z-index: 6 }
  .v-poster .h { font-size: 46px }
  .v-poster .accentrow i { border-radius: 50% }
  .v-poster .cta { border-radius: 0 } .v-poster .back { border-radius: 0 }
  .v-poster .tile { border-radius: 4px } .v-poster .mcard { border-radius: 4px }

  @media (prefers-reduced-motion: reduce) {
    .win *, .win { animation-duration: .001s !important }
  }
</style>
</head>
<body>

<h1>Onboarding, ten treatments</h1>
<p class="sub">Nothing moves on its own: the welcome waits on Get started, every screen animates in on the click that brought you to it, and the theme only changes when you pick it. Switch treatment below, or click a card in the contact sheet.</p>

<div class="bar" id="picker"></div>
<div class="bar">
  <span class="lbl" style="margin-left:0">Screen</span>
  <button class="btn" data-go="welcome">Welcome</button>
  <button class="btn" data-go="0">1</button>
  <button class="btn" data-go="1">2</button>
  <button class="btn" data-go="2">3</button>
  <button class="btn" data-go="3">4</button>
  <span class="lbl">Mode</span>
  <button class="btn" data-mode="dark" aria-pressed="true">Dark</button>
  <button class="btn" data-mode="light">Light</button>
</div>

<div class="frame">
  <div class="win" id="win" data-mode="dark">
    <div class="titlebar"><span class="mark"></span><span class="name">Prism</span><span class="wc">— □ ×</span></div>
    <div class="screen" id="screen"></div>
    <div class="ghost" id="ghost" hidden></div>
  </div>
</div>
<p class="caption" id="caption"></p>

<h2 class="sheeth">All ten</h2>
<div class="sheet" id="sheet"></div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'

const ACCENTS = [
  { name: 'Sky', a: '#38bdf8', b: '#6366f1' },
  { name: 'Ember', a: '#ff8a6a', b: '#e0574f' },
  { name: 'Moss', a: '#34d399', b: '#10b981' },
  { name: 'Plum', a: '#c084fc', b: '#7c3aed' }
]

/* ---------- shared parts ---------- */
const treeHtml = () => `
  <div class="tree">
    ${[62, 84, 54, 96, 70, 48, 88, 60].map((w, i) =>
      `<div class="row ${i === 3 ? 'on' : ''}"><i></i><u style="width:${w}px"></u></div>`).join('')}
  </div>
  <div class="keys"><span class="keycap">Ctrl</span><span class="keycap">B</span></div>`

const tilesHtml = () => `
  <div class="fan">
    ${['JPG', 'MP4', 'PDF'].map((e) => `<div class="tile"><u></u><u></u><b>${e}</b><span class="badge">${CHECK}</span></div>`).join('')}
  </div>`

const modeCards = (mode) => `
  <div class="modes">
    <div class="mcard dark ${mode === 'dark' ? 'on' : ''}" data-pick="dark">
      <div class="prev"><i></i><u></u></div><b>Dark</b><span>Quiet chrome, media leads</span></div>
    <div class="mcard light ${mode === 'light' ? 'on' : ''}" data-pick="light">
      <div class="prev"><i></i><u></u></div><b>Light</b><span>Paper white, ink black</span></div>
  </div>`

const accentRow = (idx) => `
  <div class="accentrow">
    ${ACCENTS.map((c, i) => `<i class="${i === idx ? 'on' : ''}" data-accent="${i}"
      style="background:linear-gradient(140deg, ${c.a}, ${c.b})"></i>`).join('')}
  </div>`

const foot = (i) => `
  <div class="foot">
    <div class="rail">${[0, 1, 2, 3].map((n) => `<i class="${n === i ? 'on' : ''}"></i>`).join('')}</div>
    ${i ? `<button class="back" data-step="${i - 1}">Back</button>` : ''}
    <button class="cta" data-step="${i === 3 ? 'welcome' : i + 1}">${i === 3 ? 'Start using Prism' : 'Next'}</button>
    ${i === 3 ? '' : '<span class="skip" data-step="3">Skip</span>'}
  </div>`

const COPY = [
  { k: 'Appearance', h: 'Dark, or <em>light</em>.', p: 'Both ship with their own styles. Change it whenever you like.' },
  { k: 'The sidebar', h: 'Your folder, one key away.', p: 'Ctrl+B opens the folder you came from. Click to view, arrow to move on.' },
  { k: 'Style', h: 'Make it yours.', p: 'Pick an accent now; the rest of the style waits for you in Settings.' },
  { k: 'One last thing', h: 'Open <em>everything</em> with Prism.', p: 'Images, video, audio, documents. Windows asks first, nothing changes behind your back.' }
]

/* ---------- treatments ---------- */
const V = [
  { id: 'aurora', name: 'Aurora', note: 'Deep space with soft light behind the type. Washes bloom in; nothing else competes.',
    fx: 'sweep',
    back: () => '<div class="wash"></div>' },

  { id: 'slate', name: 'Slate', note: 'Swiss: hairlines, numerals, square corners, no glow anywhere. The rule draws itself.',
    fx: 'split', numbered: true,
    back: () => '<div class="grid"></div>' },

  { id: 'spot', name: 'Spotlight', note: 'Near-black. One lamp opens behind the words and everything else falls away.',
    fx: 'iris',
    back: () => '<div class="lamp"></div>' },

  { id: 'deck', name: 'Deck', note: 'Each step is a card on a stack, dealt onto the window.',
    fx: 'fade', card: true,
    back: () => '<div class="card"></div>' },

  { id: 'film', name: 'Filmstrip', note: 'A strip of frames runs across the top and the copy sits under it.',
    fx: 'sweep', strip: true,
    back: () => `<div class="strip">${[0, 1, 2, 3, 4].map(() => '<div class="fr"></div>').join('')}</div>` },

  { id: 'split', name: 'Split', note: 'A hard colour plane holds the left, content the right. The plane slides in every time.',
    fx: 'split', plane: true,
    back: (step) => `<div class="plane">${step === 3
      ? '<div class="planetiles"><i></i><i></i><i></i></div>' : ''}</div>` },

  { id: 'term', name: 'Terminal', note: 'Mono type that types itself, green on near-black, square everything.',
    fx: 'split',
    back: () => '<div class="scan"></div>' },

  { id: 'glass', name: 'Glass', note: "Frosted panels over a blurred wall - Prism's own acrylic, turned into the setup.",
    fx: 'iris', panel: true,
    back: () => '<div class="wall"></div><div class="panel"></div>' },

  { id: 'blue', name: 'Blueprint', note: 'Outlines on grid paper. Each step draws its own diagram, stroke by stroke.',
    fx: 'fade', drawing: true,
    back: () => '<div class="paper"></div>' },

  { id: 'poster', name: 'Poster', note: 'One enormous word behind the step, letters dealt in. The controls are a footnote.',
    fx: 'sweep', poster: true,
    back: () => '' }
]

/* per-variant art for the step, where the treatment does its own thing */
const WORDS = ['LIGHT', 'FOLDER', 'STYLE', 'OPEN']
const DRAWINGS = [
  // appearance: two panes
  '<svg viewBox="0 0 400 300"><rect x="30" y="60" width="160" height="180" rx="10"/><rect x="210" y="60" width="160" height="180" rx="10" class="fillish"/><line x1="200" y1="40" x2="200" y2="260"/></svg>',
  // sidebar: window with a panel
  '<svg viewBox="0 0 400 300"><rect x="20" y="50" width="360" height="200" rx="12"/><line x1="140" y1="50" x2="140" y2="250"/><line x1="45" y1="90" x2="115" y2="90"/><line x1="45" y1="120" x2="105" y2="120"/><line x1="45" y1="150" x2="118" y2="150"/><rect x="170" y="100" width="180" height="100" rx="8" class="fillish"/></svg>',
  // style: a colour wheel
  '<svg viewBox="0 0 400 300"><circle cx="200" cy="150" r="86"/><circle cx="200" cy="150" r="42" class="fillish"/><line x1="200" y1="34" x2="200" y2="64"/><line x1="316" y1="150" x2="286" y2="150"/><line x1="200" y1="266" x2="200" y2="236"/><line x1="84" y1="150" x2="114" y2="150"/></svg>',
  // default: file with a tick
  '<svg viewBox="0 0 400 300"><path d="M140 50h90l40 40v160a10 10 0 0 1-10 10H140a10 10 0 0 1-10-10V60a10 10 0 0 1 10-10z"/><path d="M230 50v40h40"/><path d="M165 165l25 25 50-55"/></svg>'
]

let cur = 'aurora'
let step = 'welcome'
let mode = 'dark'
let accent = 0

const win = document.getElementById('win')
const screen = document.getElementById('screen')
const ghost = document.getElementById('ghost')

function variant() { return V.find((v) => v.id === cur) }

function screenHtml(v, s, st, md, ac) {
  if (st === 'welcome') {
    return `${v.back ? v.back('welcome') : ''}
      ${v.poster ? `<div class="word"><b>${'PRISM'.split('').map((c, i) =>
        `<span style="animation-delay:${.1 + i * .06}s">${c}</span>`).join('')}</b></div>` : ''}
      <div class="welcome"><div class="inner">
        ${v.poster ? '' : '<div class="logo"></div>'}
        <h2>Welcome to Prism</h2>
        <p>Open a file. Look at it. Move on.</p>
        <button class="cta" data-step="0">Get started</button>
      </div></div>`
  }
  const c = COPY[st]
  const control = st === 0 ? modeCards(md) : st === 2 ? accentRow(ac) : ''
  const art =
    st === 1 ? treeHtml() :
    st === 3 && !v.plane ? tilesHtml() : ''
  return `
    ${v.back ? v.back(st) : ''}
    ${v.poster ? `<div class="word"><b>${WORDS[st].split('').map((ch, i) =>
      `<span style="animation-delay:${.08 + i * .05}s">${ch}</span>`).join('')}</b></div>` : ''}
    ${v.drawing ? `<div class="drawing">${DRAWINGS[st]}</div>` : ''}
    ${art}
    <div class="pad in ${st === 1 && !v.plane && !v.poster ? 'shift' : ''}">
      ${v.numbered ? `<div class="num">0${st + 1} / 04</div>` : `<div class="kicker">${c.k}</div>`}
      <h1 class="h">${c.h}</h1>
      ${v.numbered ? '<div class="rule"></div>' : ''}
      <p class="p">${c.p}</p>
      ${control}
      ${foot(st)}
    </div>`
}

function render(skipIn = false) {
  const v = variant()
  win.className = 'win v-' + v.id
  win.dataset.mode = mode
  if (v.id === 'slate' || v.id === 'spot' || v.id === 'poster') {
    win.style.removeProperty('--accent')
    win.style.removeProperty('--accent-2')
  } else {
    win.style.setProperty('--accent', ACCENTS[accent].a)
    win.style.setProperty('--accent-2', ACCENTS[accent].b)
  }
  screen.innerHTML = screenHtml(v, step, step, mode, accent)
  // After a theme change the screen is already on view: dealing it in again is
  // what read as a glitch, so the parts just stay where they are.
  if (skipIn) screen.querySelectorAll('.in').forEach((el) => el.classList.remove('in'))
  document.getElementById('caption').innerHTML = '<b>' + v.name + '</b> — ' + v.note
  document.querySelectorAll('#picker .btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === cur)))
  document.querySelectorAll('.btn[data-go]').forEach((b) => b.setAttribute('aria-pressed', String(String(step) === b.dataset.go)))
  document.querySelectorAll('.btn[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)))
}

/* ---------- the theme change: a clipped copy of the window, revealed ---------- */
const SHAPES = {
  sweep: ['polygon(120% -20%, 220% -20%, 220% 120%, 20% 120%)', 'polygon(-120% -20%, 220% -20%, 220% 120%, -220% 120%)'],
  iris: ['circle(0% at 26% 72%)', 'circle(160% at 26% 72%)'],
  split: ['inset(0 0 100% 0)', 'inset(0 0 0 0)'],
  fade: ['inset(0 0 0 0)', 'inset(0 0 0 0)']
}

// One transition at a time. A second click mid-sweep used to start another one
// over the top of it, which is where the flicker came from.
let busy = false

function setMode(next) {
  if (next === mode || busy) return
  busy = true
  const v = variant()
  const [from, to] = SHAPES[v.fx] || SHAPES.sweep
  const ms = v.fx === 'fade' ? 520 : 820
  // Show the choice immediately, before the sweep has finished travelling.
  screen.querySelectorAll('.mcard').forEach((c) => c.classList.toggle('on', c.dataset.pick === next))
  ghost.hidden = false
  ghost.innerHTML = `<div class="win v-${v.id}" data-mode="${next}"
      style="position:absolute;inset:0;width:100%;max-width:none;border:0;border-radius:0;aspect-ratio:auto;
             ${v.id === 'slate' || v.id === 'spot' || v.id === 'poster' ? '' : `--accent:${ACCENTS[accent].a};--accent-2:${ACCENTS[accent].b}`}">
      <div class="titlebar"><span class="mark"></span><span class="name">Prism</span><span class="wc">— □ ×</span></div>
      <div class="screen" style="inset:34px 0 0">${screenHtml(v, step, step, next, accent).replace(/class="pad in/g, 'class="pad')}</div>
    </div>`
  ghost.style.clipPath = from
  ghost.style.opacity = v.fx === 'fade' ? '0' : '1'
  ghost.getBoundingClientRect()
  ghost.style.transition = `clip-path ${ms}ms cubic-bezier(.16,1,.3,1), opacity .5s ease-out`
  ghost.style.clipPath = to
  ghost.style.opacity = '1'
  setTimeout(() => {
    mode = next
    // Repaint underneath first, hide the copy on the next frame: swapping the
    // other way round showed one frame of the old theme.
    render(true)
    requestAnimationFrame(() => {
      ghost.hidden = true
      ghost.style.transition = 'none'
      ghost.innerHTML = ''
      busy = false
    })
  }, ms)
}

/* ---------- the contact sheet ---------- */
function sheet() {
  document.getElementById('sheet').innerHTML = V.map((v) => `
    <div class="cell" data-cell="${v.id}">
      <header><h3>${v.name}</h3><span>${v.note.split('.')[0]}</span></header>
      <div class="mini"><div class="win v-${v.id}" data-mode="dark" style="aspect-ratio:16/10">
        <div class="titlebar"><span class="mark"></span><span class="name">Prism</span><span class="wc">— □ ×</span></div>
        <div class="screen">${screenHtml(v, 0, 0, 'dark', 0)}</div>
      </div></div>
    </div>`).join('')
}

document.getElementById('picker').innerHTML = '<span class="lbl" style="margin-left:0">Treatment</span>' +
  V.map((v) => `<button class="btn" data-v="${v.id}">${v.name}</button>`).join('')

document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-v]')
  if (pick) { cur = pick.dataset.v; step = 'welcome'; render(); return }
  const cell = e.target.closest('[data-cell]')
  if (cell) { cur = cell.dataset.cell; step = 'welcome'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return }
  const s = e.target.closest('[data-step]')
  if (s) { if (busy) return; step = s.dataset.step === 'welcome' ? 'welcome' : Number(s.dataset.step); render(); return }
  const g = e.target.closest('.btn[data-go]')
  if (g) { step = g.dataset.go === 'welcome' ? 'welcome' : Number(g.dataset.go); render(); return }
  const p = e.target.closest('[data-pick]')
  if (p) { setMode(p.dataset.pick); return }
  const a = e.target.closest('[data-accent]')
  if (a) { accent = Number(a.dataset.accent); render(); return }
  const m = e.target.closest('.btn[data-mode]')
  if (m) { if (m.dataset.mode === mode) return; setMode(m.dataset.mode); return }
})

render()
sheet()
</script>
</body>
</html>
