<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Prism loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      :root {
        --ink: #08080b;
        --cream: #f2f3f7;
        --muted: #babfcc;
        --hint: #78787e;
        --accent: #5b5bd6;
        --display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: var(--ink); z-index: 0; }
      /* Never transformed. A CSS transform on the element a <video> lives in
         puts it on a composited layer that gets resampled, and the resampling
         drops about one frame in six: the same clip measures 0% duplicated
         frames on its own and 16% inside a scaled box. That is the hitch. The
         window is sized directly and faded by a veil over the top of it. */
      #screen { position: absolute; z-index: 2; border-radius: 12px; overflow: hidden;
        box-shadow: 0 40px 90px -25px rgba(0, 0, 0, 0.92); }
      #veil { position: absolute; inset: 0; background: #08080b; z-index: 5; opacity: 0;
        pointer-events: none; }
      /* contain, not cover. The boxes below are cut to the footage's own 3:2,
         but a clip that ever differs should letterbox rather than lose an edge:
         cover was quietly shaving the file tree off the left of every shot that
         had one. */
      #screen .clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .mask { display: block; overflow: hidden; padding-bottom: 5px; }
      .line { display: block; font-family: var(--display); font-weight: 800; color: var(--cream);
        letter-spacing: -0.045em; white-space: nowrap; }
      .rule { display: block; width: 100px; height: 3px; background: var(--accent);
        transform: scaleX(0); transform-origin: left center; }
      .sub { display: block; font-family: var(--mono); letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--muted); }
      .rail, .num { font-family: var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
      .rail { position: absolute; left: 96px; top: 74px; font-size: 15px; color: var(--muted); z-index: 4; }
      .hair { position: absolute; left: 96px; right: 84px; top: 108px; height: 1px;
        background: #1d1d24; z-index: 4; }
      #progress { position: absolute; left: 96px; right: 84px; bottom: 74px; height: 2px;
        background: var(--accent); transform: scaleX(0); transform-origin: left center; z-index: 4; }
      .end { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 6; }
      .wordmark { display: block; font-family: var(--display); font-size: 196px; font-weight: 800;
        letter-spacing: -0.05em; line-height: 1.06; color: var(--cream); }
      .end-line { display: block; font-family: var(--mono); font-size: 19px; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--muted); margin-top: 24px; }

      #screen { left: 160px; top: 8px; width: 1600px; height: 1064px; border-radius: 15px; }
      .band { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; z-index: 3;
        background: linear-gradient(to top, rgba(4,4,6,.94) 12%, rgba(4,4,6,0) 100%); }
      .word { position: absolute; left: 104px; bottom: 96px; z-index: 4; }
      .line { font-size: 118px; line-height: 1; }
      .tag { position: absolute; right: 104px; bottom: 122px; font-family: var(--mono); font-size: 17px;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); z-index: 4; }
      #progress { left: 104px; right: 104px; bottom: 62px; }
    </style>
  </head>
  <body>
    <!-- Generated by tools/showcase/films.mjs. Edit the film's beats there. -->
    <div
      id="root"
      data-composition-id="loop"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="7.4"
    >
      <div id="ground" class="clip bg" data-start="0" data-duration="7.4" data-track-index="9"></div>

      <div id="screen">
        <video id="v-open" class="clip" src="assets/open.mp4" data-start="0" data-duration="0.9" data-track-index="0" muted playsinline></video>
        <video id="v-zoom" class="clip" src="assets/zoom.mp4" data-start="0.9" data-duration="0.9" data-track-index="0" data-media-start="1.4" muted playsinline></video>
        <video id="v-tree-walk" class="clip" src="assets/tree-walk.mp4" data-start="1.8" data-duration="0.9" data-track-index="0" data-media-start="2.2" muted playsinline></video>
        <video id="v-video" class="clip" src="assets/video.mp4" data-start="2.7" data-duration="0.9" data-track-index="0" data-media-start="1.2" muted playsinline></video>
        <video id="v-audio" class="clip" src="assets/audio.mp4" data-start="3.6" data-duration="0.9" data-track-index="0" data-media-start="1.4" muted playsinline></video>
        <video id="v-viz-tour" class="clip" src="assets/viz-tour.mp4" data-start="4.5" data-duration="0.9" data-track-index="0" data-media-start="6.4" muted playsinline></video>
        <video id="v-style-many" class="clip" src="assets/style-many.mp4" data-start="5.4" data-duration="0.9" data-track-index="0" data-media-start="3.2" muted playsinline></video>
        <video id="v-style-video" class="clip" src="assets/style-video.mp4" data-start="6.3" data-duration="1.1" data-track-index="0" data-media-start="4.4" muted playsinline></video>
      </div>

      <div id="band" class="clip band" data-start="0" data-duration="7.40" data-track-index="8"></div>
      <div id="rule" class="clip" data-start="0" data-duration="7.40" data-track-index="7">
        <div id="progress"></div>
      </div>

      <div id="w1" class="clip word" data-start="0.15" data-duration="0.75" data-track-index="1">
        <span class="mask"><span class="line" style="font-size:118px">open any file</span></span>
      </div>

      <div id="w3" class="clip word" data-start="1.95" data-duration="0.75" data-track-index="1">
        <span class="mask"><span class="line" style="font-size:118px">the whole folder</span></span>
      </div>

      <div id="w5" class="clip word" data-start="3.75" data-duration="0.75" data-track-index="1">
        <span class="mask"><span class="line" style="font-size:118px">watch, hear, read</span></span>
      </div>

      <div id="w7" class="clip word" data-start="5.55" data-duration="0.75" data-track-index="1">
        <span class="mask"><span class="line" style="font-size:118px">make it yours</span></span>
      </div>


      <div id="veil" class="clip" data-start="0" data-duration="7.4" data-track-index="6"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const BEATS = [
        [0.15, 0.75, false],
        [1.05, 0.75, false],
        [1.95, 0.75, false],
        [2.85, 0.75, false],
        [3.75, 0.75, false],
        [4.65, 0.75, false],
        [5.55, 0.75, false],
        [6.45, 0.95, false]
      ];

      BEATS.forEach(([at, len, hasTag], i) => {
        const w = `#w${i + 1}`;
        tl.fromTo(`${w} .line`, { yPercent: 115 }, { yPercent: 0, duration: 0.62, ease: "power3.out" }, at);
        tl.to(`${w} .line`, { yPercent: -115, duration: 0.34, ease: "power2.in" }, at + len - 0.36);
        if (hasTag) {
          const g = `#g${i + 1}`;
          tl.fromTo(g, { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at + 0.12);
          tl.to(g, { opacity: 0, duration: 0.28, ease: "power2.in" }, at + len - 0.32);
        }
      });

      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 7.40, ease: "none" }, 0);
      tl.fromTo("#veil", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);

      window.__timelines["loop"] = tl;
    </script>
  </body>
</html>
