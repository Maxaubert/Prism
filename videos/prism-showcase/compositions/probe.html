<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>probe</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; box-sizing: border-box }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000 }
      #root { position: relative; width: 1920px; height: 1080px }
      #screen { position: absolute; left: 684px; top: 166px; width: 1152px; height: 766px;
        border-radius: 12px; overflow: hidden; box-shadow: 0 40px 90px -25px rgba(0,0,0,.92) }
      #screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="probe" data-start="0" data-width="1920" data-height="1080" data-duration="5">
      <div id="screen">
        <video id="p" class="clip" src="assets/viz-tour.mp4" data-start="0" data-duration="5" data-track-index="0" muted playsinline></video>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      const tl = gsap.timeline({ paused: true })
      tl.fromTo("#screen", { scale: 0.985, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0)
      window.__timelines["probe"] = tl
    </script>
  </body>
</html>
