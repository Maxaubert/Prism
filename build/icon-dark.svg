    <path d="M262 450h500v150H262z"/>
    <path d="M262 300h150v420H262z"/>
  </g>
  <path fill="#2f6fed" d="M262 720h150v122a38 38 0 0 1-38 38h-74a38 38 0 0 1-38-38z"/>
</svg>
