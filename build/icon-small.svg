<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 16-32px. The rendered prism silts up down here, and its bottom facet is
       the tile's own colour, so the small mark keeps only the two lit faces -
       and is centred on those, since they are what the eye sees. -->
