<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: fsmedia: https:; media-src 'self' blob: fsmedia: fsaudio: https:; connect-src 'self' fsmedia: fsaudio:; object-src 'self' blob: fsmedia:; frame-src 'self' blob: fsmedia:; font-src 'self' data: blob: fsmedia:"
    />
    <title>Prism</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      #prism-boot {
        height: 100%; display: flex; flex-direction: column;
        background: #101215; color: #e3e6ea; font: 16px 'Segoe UI', system-ui, sans-serif;
      }
      [data-boot-mode='light'] #prism-boot { background: #f5f6f7; color: #202328; }
      #prism-boot header { display: flex; align-items: center; height: 40px; -webkit-app-region: drag; }
      #prism-boot strong { margin: 0 auto 0 20px; font-size: 14px; font-weight: 600; }
      #prism-boot button {
        width: 46px; height: 40px; padding: 0; border: 0; background: transparent;
        color: inherit; -webkit-app-region: no-drag; cursor: default;
      }
      #prism-boot button:hover { background: #80808024; }
      #prism-boot button:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
      #prism-boot #boot-close:hover { background: #c42b1c; color: white; }
      #prism-boot svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1; }
      /* A SILENT OUTLINE OF THE EXPLORER, NOT A LOADING SCREEN (#271; owner,
         2026-10-04: "I don't ever want to see that", of the old start-up line).
         The tab strip, the toolbar, the places rail and the list's header as
         hairlines, no words and nothing moving, for the few frames before
         the app draws itself. Owner-approved recommendation 6. */
      #prism-boot { --boot-line: #ffffff14; }
      [data-boot-mode='light'] #prism-boot { --boot-line: #00000014; }
      #prism-boot main { position: relative; flex: 1; display: grid; grid-template-rows: 40px 1fr; }
      #prism-boot .boot-toolbar { border-bottom: 1px solid var(--boot-line); }
      #prism-boot .boot-body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
      #prism-boot .boot-places { border-right: 1px solid var(--boot-line); }
      #prism-boot .boot-columns { height: 32px; border-bottom: 1px solid var(--boot-line); }
      /* Only a failed start has anything to say; until then it is empty. */
      #boot-status { position: absolute; inset: 40px 0 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; }
      #boot-status:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="prism-boot" data-testid="window-boot">
        <header>
          <strong>Prism</strong>
          <button id="boot-minimize" aria-label="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" /></svg></button>
          <button id="boot-maximize" aria-label="Maximize"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" /></svg></button>
          <button id="boot-close" aria-label="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m1 1 10 10M1 11 11 1" /></svg></button>
        </header>
        <main>
          <div class="boot-toolbar"></div>
          <div class="boot-body"><div class="boot-places"></div><div><div class="boot-columns"></div></div></div>
          <p id="boot-status" role="status"></p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
